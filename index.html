<title>Transfer Savaşı – Futbolcu Açık Artırma Ligi (Copy)</title>
<style>
:root{
  --bg:#f3f6f4;--card:#ffffff;--text:#14201a;--muted:#5d6b63;--line:#dfe6e1;
  --accent:#16a34a;--accent-ink:#ffffff;--accent-soft:#dcfce7;--warn:#d97706;--danger:#dc2626;--gold:#eab308;
  --c0:#2563eb;--c1:#dc2626;--c2:#9333ea;--c3:#ea580c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1511;--card:#17211b;--text:#e8f0ea;--muted:#9aa9a0;--line:#26332b;--accent:#22c55e;--accent-ink:#04210f;--accent-soft:#12301d;}
}
:root[data-theme="dark"]{--bg:#0e1511;--card:#17211b;--text:#e8f0ea;--muted:#9aa9a0;--line:#26332b;--accent:#22c55e;--accent-ink:#04210f;--accent-soft:#12301d;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45;min-height:100%}
#app{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:4px 0 2px}
h2{font-size:1.15rem;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
label{display:block;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=number]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem}
input[type=range]{width:100%;accent-color:var(--accent)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 16px;border-radius:10px;font-weight:600}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--danger)}
.seg button{flex:1}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.big{font-size:2rem;font-weight:800}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--accent-soft);color:var(--text)}
.pos-GK{background:#fde68a;color:#422006}.pos-DEF{background:#bfdbfe;color:#0c1f4a}.pos-MID{background:#bbf7d0;color:#052e16}.pos-FWD{background:#fecaca;color:#450a0a}
.lot{text-align:center;padding:22px 12px}
.lot .name{font-size:1.8rem;font-weight:800;margin:6px 0}
.ovr{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:1.7rem;font-weight:800}
.bid{font-size:2.4rem;font-weight:900;color:var(--accent)}
.mgr{border-left:5px solid var(--line)}
.mgr.turn{outline:2px solid var(--accent)}
.mgr small{display:block;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chips span{font-size:.78rem;padding:2px 7px;border-radius:99px;border:1px solid var(--line)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:3px 0 8px}
.bar>i{display:block;height:100%;background:var(--accent)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th:nth-child(2),td:nth-child(2){text-align:left}
tr.first td{font-weight:800;background:var(--accent-soft)}
.match{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.match b{min-width:54px;text-align:center}
.live{min-height:0}
.live .score{font-size:1.8rem;font-weight:900;text-align:center}
.ev{padding:3px 0}
.champ{text-align:center;padding:26px 12px;background:linear-gradient(135deg,var(--accent-soft),var(--card));border-color:var(--accent)}
.champ .big{font-size:2.3rem}
.note{font-size:.9rem;color:var(--muted)}
.banner{padding:10px 12px;border-radius:10px;background:var(--accent-soft);margin-bottom:12px;font-weight:600}
.banner.no{background:#fee2e2;color:#450a0a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .banner.no{background:#3b1414;color:#fecaca}}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
.hud .sc{font-size:1.9rem}
canvas#pitch{width:100%;display:block;border-radius:10px;background:#2e7d32;margin:6px 0}
#evlog{min-height:1.4em}
.spd button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:.72rem;font-weight:800}
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;font-size:.88rem}
.lineup div.l{display:flex;align-items:center;gap:6px;padding:2px 0}
details summary{cursor:pointer;font-weight:600}
.modal{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;background:rgba(0,0,0,.62);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(10px,env(safe-area-inset-top,0px)) 10px max(10px,env(safe-area-inset-bottom,0px))}
.modal[hidden]{display:none}
.modal .sheet{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;max-width:560px;margin:auto}
.tpitch{position:relative;width:100%;aspect-ratio:3/4;max-height:70vh;margin:0 auto;border-radius:12px;border:2px solid rgba(255,255,255,.75);overflow:hidden;background:repeating-linear-gradient(0deg,#2a7a2e 0 10%,#2f8433 10% 20%)}
.tpitch .tl{position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,255,255,.6)}
.tpitch .tc{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.6);border-radius:50%}
.tpitch .tb{position:absolute;left:25%;right:25%;height:14%;border:2px solid rgba(255,255,255,.6)}
.tpitch .tbt{top:0;border-top:0}.tpitch .tbb{bottom:0;border-bottom:0}
.tok{position:absolute;transform:translate(-50%,-50%);width:16%;text-align:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tok .c{width:40px;height:40px;border-radius:50%;background:#fff;color:#111;font-weight:800;display:flex;align-items:center;justify-content:center;border:3px solid #16a34a;margin:0 auto}
.tok.off .c{border-color:var(--warn)}
.tok.sel .c{box-shadow:0 0 0 4px var(--gold);transform:scale(1.1)}
.tok .n{font-size:.66rem;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;font-weight:600}
.tok .w{font-size:.58rem;color:#fde68a;text-shadow:0 1px 2px #000;font-weight:700}
@supports not (aspect-ratio:1/1){.tpitch{height:0;padding-bottom:133.33%;max-height:none}.tpitch .tc{height:0;padding-bottom:22%}}

</style>
</head>

function needsOf(A,i){

  const have={GK:0,DEF:0,MID:0,FWD:0};A.managers[i].squad.forEach(id=>have[PLAYERS[id].pos]++);
  const u={};for(const k of ['GK','DEF','MID','FWD'])u[k]=Math.max(0,target[k]-have[k]);return u;
}
// Bir botun bu futbolcuya biçtiği değer. Mevkisi kadroda ihtiyaç değilse 0 (pas), ancak
// havuzda ihtiyaçlarını karşılayacak kadar oyuncu kalmadıysa yedek plan olarak düşük değer biçer.
function botValue(A,i,p){
  const m=A.managers[i],left=A.cfg.squad-m.squad.length;if(left<=0)return 0;
  const unmet=needsOf(A,i),remain=[p.id,...A.queue].map(id=>PLAYERS[id]);
  const avail={GK:0,DEF:0,MID:0,FWD:0};remain.forEach(r=>avail[r.pos]++);
  const fillable=['GK','DEF','MID','FWD'].reduce((s,k)=>s+Math.min(unmet[k],avail[k]),0);
  const wants=unmet[p.pos]>0;
  if(!wants&&(fillable>=left||p.pos==='GK'))return 0; // ikinci kaleciye hiçbir koşulda para verme

  const f=clamp(1+(p.ovr-meanPos)/6,0.3,2.2);

  let demand=0;A.managers.forEach((_,j)=>demand+=needsOf(A,j)[p.pos]);
  const scarce=wants&&avail[p.pos]<=demand?1.15:1;
  let v=(m.budget/left)*W[p.pos]*f*m.aggr*(0.92+A.rng()*0.16)*scarce*(wants?1:0.5);
  v=Math.min(v,left>1?m.budget*0.7:m.budget);
  v=Math.round(v);
  return wants?Math.max(1,v):v;
}
// Gizli yıldızın ihtiyacımız olan mevkiden çıkma ihtimali (kalan 85+ oyuncuların mevki dağılımına göre)
function mysteryFit(A,i){
  const unmet=needsOf(A,i),arr=A.queue.filter(id=>PLAYERS[id].ovr>=MYST_MIN).concat([A.lot.pid]);
  return arr.filter(id=>unmet[PLAYERS[id].pos]>0).length/arr.length;
}
// Kalecisi zaten dolu olan bot, gizli kartın kaleci çıkma riskini (ikinci kaleci) almaz
function mystGKRisk(A,i){
  if(needsOf(A,i).GK>0)return false;
  const arr=A.queue.filter(id=>PLAYERS[id].ovr>=MYST_MIN).concat([A.lot.pid]);
  return arr.filter(id=>PLAYERS[id].pos==='GK').length/arr.length>0.08;
}
// 1 TL'lik yıldız kartı: ihtiyaç duyduğu mevkiden gelme ihtimali yüksekse alır
function botWantsMystery(A,i){return A.managers[i].squad.length<A.cfg.squad&&!mystGKRisk(A,i)&&mysteryFit(A,i)>=0.8;}
// Gizli yıldız için körlemesine değer: yıldız seviyesi × ihtiyaç olasılığı
function botValueMystery(A,i){
  const m=A.managers[i],left=A.cfg.squad-m.squad.length;if(left<=0)return 0;
  if(mystGKRisk(A,i))return 0;
  const p=mysteryFit(A,i);if(p<0.65)return 0;
  const pool=A.queue.map(id=>PLAYERS[id].ovr),mean=pool.length?pool.reduce((a,b)=>a+b,0)/pool.length:80;
  const f=clamp(1+(MYST_MIN+2-mean)/6,1,2.2);
  let v=(m.budget/left)*f*p*m.aggr*(0.9+A.rng()*0.2)*0.9;
  v=Math.min(v,left>1?m.budget*0.6:m.budget);
  return Math.max(1,Math.round(v));
}
// Dönen değer: verilecek teklif (lot.bid'den büyük) ya da 0 = pas
function botDecide(A,i){
  const lot=A.lot;if(!lot.vals)lot.vals={};
  if(lot.vals[i]===undefined)lot.vals[i]=lot.mystery?botValueMystery(A,i):botValue(A,i,PLAYERS[lot.pid]);
  const cap=Math.min(lot.vals[i],maxBid(A,i));
  if(cap<=lot.bid)return 0;
  const gap=cap-lot.bid;let inc=1;
  if(gap>3)inc=1+Math.floor(A.rng()*Math.min(3,gap/2));
  return Math.min(cap,lot.bid+inc);
}

    const pInt=clamp((0.05+d/480)*Math.pow(ratio,3)*(dx>25?1.25:1)*(this.oppDist(t.x,t.y,ti)<5?1.5:1),0.02,0.3);
    if(this.rng()<pInt){
      const mx=(H.x+t.x)/2,my=(H.y+t.y)/2,o=this.teams[1-ti].slice().sort((a,b)=>Math.hypot(a.x-mx,a.y-my)-Math.hypot(b.x-mx,b.y-my))[0];
      this.kick(o,clamp(d/34,0.4,1),()=>{this.holder=o;this.poss=o.team;this.passTimer=0.3;});return;
    }
    this.kick(t,clamp(d/32,0.4,1.3),()=>{this.holder=t;this.passTimer=0.2+this.rng()*0.3;});
  }
  shoot(H){
    const ti=H.team,dir=ti?-1:1,gx=dir>0?PW:0,gk=this.keeperOf(1-ti),r=this.rng();
    this.passTimer=0.9;if(this.speed<3)this.sfx('gasp');
    if(r<0.42){
      const gy=PH/2+(this.rng()-0.5)*9;gk.ov={x:gk.bx,y:clamp(gy,25,43)};
      this.kick({x:gx,y:gy},0.5,()=>{this.kick(gk,0.35,()=>{this.holder=gk;this.poss=1-ti;gk.ov=null;this.passTimer=0.8;});});
    }else if(r<0.78){
      const gy=PH/2+(this.rng()<0.5?-1:1)*(6+this.rng()*6);
      this.kick({x:gx+dir*4,y:gy},0.55,()=>{this.after(0.3,()=>{this.kick(gk,0.9,()=>{this.holder=gk;this.poss=1-ti;this.passTimer=0.8;});});});
    }else{ // savunma önünü kesti
      const o=this.teams[1-ti].slice().sort((a,b)=>Math.hypot(a.x-H.x,a.y-H.y)-Math.hypot(b.x-H.x,b.y-H.y))[0];
      this.kick(o,0.3,()=>{this.holder=o;this.poss=o.team;this.passTimer=0.4;});
    }
  }
  // Gol sahnesi: önce hücum organizasyonu (orta sahaya pas), sonra asist ve şut. Tür: normal / uzaktan / penaltı
  startGoal(e){
    const ti=e.side==='h'?0:1,T=this.teams[ti],dir=ti?-1:1,gx=dir>0?PW:0,kind=e.kind||'normal';
    const scorer=T.find(s=>s.p.id===e.player.id)||T[0];
    const assist=e.assist?(T.find(s=>s.p.id===e.assist.id&&s!==scorer)||null):null;
    this.ei++;this.mode='goalseq';this.poss=ti;this.cur={e,ti,scorer,assist};this.holder=null;this.timers=[];
    if(kind==='pen')this.sfx('whistle_pen'); // penaltı: hakem düdüğü
    const rg=()=>this.rng();
    const gk=this.keeperOf(1-ti),gy=PH/2+(rg()-0.5)*(kind==='pen'?6:5);
    let sx,sy;
    if(kind==='pen'){sx=gx-dir*11;sy=PH/2;}
    else if(kind==='long'){sx=gx-dir*(25+rg()*10);sy=PH/2+(rg()-0.5)*26;}
    else{sx=gx-dir*(8+rg()*8);sy=PH/2+(rg()-0.5)*16;}
    scorer.ov={x:sx,y:sy};
    const finish=()=>{
      gk.ov={x:gk.bx,y:clamp(PH/2+(gy-PH/2)*-0.6,26,42)};
      this.kick({x:gx,y:gy},kind==='long'?0.8:kind==='pen'?0.45:0.5,()=>this.goalScored());
    };
    const chain=(list,i,done)=>{
      if(i>=list.length){done();return;}
      const p=list[i];this.kick(p,0.6,()=>{this.holder=p;this.after(0.3,()=>chain(list,i+1,done));});
    };
    if(kind==='pen'){
      const b=this.ball;this.kick({x:sx,y:sy},clamp(Math.hypot(b.x-sx,b.y-sy)/40,0.5,1.2),()=>{this.holder=scorer;this.after(0.9,finish);});
      return;
    }
    const list=[];
    // top kendi yarı sahadaysa önce bir orta saha oyuncusuna ilerlet
    const bx=this.ball.x,behind=dir>0?bx<PW*0.45:bx>PW*0.55;
    if(behind){
      const mids=T.filter(s=>s!==scorer&&s!==assist&&s.pos!=='GK').sort((p,q)=>Math.abs(p.x-PW/2)-Math.abs(q.x-PW/2));
      if(mids[0]){mids[0].ov={x:PW/2+dir*(rg()*8-2),y:clamp(mids[0].y+(rg()-0.5)*12,8,PH-8)};list.push(mids[0]);}
    }
    if(assist){
      if(kind==='long')assist.ov={x:gx-dir*(38+rg()*10),y:PH/2+(rg()-0.5)*30};
      else if(rg()<0.55)assist.ov={x:gx-dir*(14+rg()*10),y:rg()<0.5?7:PH-7}; // orta (kanat)
      else assist.ov={x:gx-dir*(26+rg()*8),y:PH/2+(rg()-0.5)*30};          // ara pas
      list.push(assist);
    }
    list.push(scorer);
    chain(list,0,()=>this.after(0.45,finish));
  }
  goalScored(){
    const {e,ti,scorer}=this.cur,dir=ti?-1:1,gx=dir>0?PW:0;
    this.score[ti]++;this.clock=Math.max(this.clock,e.min);this.log.push({min:e.min,ti,name:e.player.name,assist:e.assist?e.assist.name:null,kind:e.kind||'normal'});
    const tag=e.kind==='pen'?' (penaltı)':e.kind==='long'?' (uzaktan)':'';
    this.sfx('goal'); // seyirci sevinci
    this.mode='celebrate';this.modeT=2.8;this.banner={text:'GOL!',sub:e.player.name+" "+e.min+"'"+tag,sub2:e.assist?'Asist: '+e.assist.name:'',ti};
    this.holder=null;this.ball.flying=false;this.ball.x=gx;this.ball.y=this.ball.ty;
    const cx=gx-dir*4,cy=scorer.y>PH/2?PH-5:5;scorer.ov={x:cx,y:cy};
    this.teams[ti].forEach(s=>{if(s!==scorer&&s.pos!=='GK')s.ov={x:cx-dir*(2+this.rng()*7),y:cy+(cy>PH/2?-1:1)*(1+this.rng()*8)};});
  }
  skipToEnd(){
    while(this.ei<this.events.length){const e=this.events[this.ei++],ti=e.side==='h'?0:1;this.score[ti]++;this.log.push({min:e.min,ti,name:e.player.name,assist:e.assist?e.assist.name:null,kind:e.kind||'normal'});}
    this.clock=90;this.mode='full';this.done=true;
  }
  moveBall(dt){
    const b=this.ball;
    if(b.flying){
      if(b.target){b.tx=b.target.x;b.ty=b.target.y;}
      b.t+=dt/b.dur;const p=Math.min(1,b.t),e=p*(2-p);
      b.x=b.fx+(b.tx-b.fx)*e;b.y=b.fy+(b.ty-b.fy)*e;
      if(p>=1){b.flying=false;const cb=b.cb;b.cb=null;if(cb)cb();}
    }else if(this.holder){const d=this.holder.team?-1:1;b.x=this.holder.x+d*1.3;b.y=this.holder.y+0.3;}
  }
  movePlayers(dt){
    const b=this.ball,k=Math.min(1,dt*2.6);
    for(const ti of [0,1]){
      const dir=ti?-1:1,has=this.poss===ti;
      for(const s of this.teams[ti]){
        let tx,ty;
        if(s.ov){tx=s.ov.x;ty=s.ov.y;}
        else if(s.pos==='GK'){tx=s.bx;ty=clamp(s.by+(b.y-PH/2)*0.2,22,46);}
        else{
          const push=has?7:-4,wob=Math.sin(this.t*0.9+s.no*1.7)*1.4,wob2=Math.cos(this.t*0.7+s.no*2.3)*1.4;
          tx=s.bx+dir*push+(b.x-PW/2)*0.2+(b.x-s.bx)*0.12+wob;ty=s.by+(b.y-s.by)*0.18+wob2;
          if(s===this.holder)tx+=dir*3;
        }
        s.x+=(tx-s.x)*k;s.y+=(ty-s.y)*k;
        s.x=clamp(s.x,1,PW-1);s.y=clamp(s.y,1,PH-1);
      }
    }
  }
}

// Sırası bota geldiyse kısa bir bekleyişle hamlesini yaptır
function scheduleBot(){
  clearTimeout(botTimer);
  if(screen!=='auction'||!A||!A.lot)return;
  if(ONL.on&&ONL.role!=='host')return; // online: botları yalnızca host oynatır
  const t=A.lot.turn;if(!A.managers[t].bot)return;
  const ref=A,allBots=A.managers.every(m=>m.bot);
  botTimer=setTimeout(()=>{
    if(A!==ref||screen!=='auction'||!A.lot||A.lot.turn!==t)return;
    const lot=A.lot;
    if(lot.mystery&&lot.offer){if(botWantsMystery(A,t)&&takeMystery(A)){}else declineMystery(A);afterAuction();return;}
    const d=botDecide(A,t);
    if(d>lot.bid&&placeBid(A,d)){}else passTurn(A);
    afterAuction();
  },allBots?250:(ONL.on?450:800));
}

function setBudget(v){cfg.budget=v;if(cfg.squad>v){cfg.squad=v;$('sq').value=v;$('sqv').textContent=v;}$('bgv').textContent=v;}

const M=3;
function drawMatch(cv,sim){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth||600,h=w*PH/(PW+2*M);
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  cv.style.height=h+'px';
  const ctx=cv.getContext('2d'),sc=cv.width/(PW+2*M);
  ctx.setTransform(sc,0,0,sc,M*sc,0);
  ctx.fillStyle='#2e7d32';ctx.fillRect(-M,0,PW+2*M,PH);
  for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#2f8433':'#2a7a2e';ctx.fillRect(i*PW/10,0,PW/10,PH);}
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=0.35;
  ctx.strokeRect(0,0,PW,PH);
  ctx.beginPath();ctx.moveTo(PW/2,0);ctx.lineTo(PW/2,PH);ctx.stroke();
  ctx.beginPath();ctx.arc(PW/2,PH/2,9.15,0,Math.PI*2);ctx.stroke();
  ctx.strokeRect(0,PH/2-20.15,16.5,40.3);ctx.strokeRect(PW-16.5,PH/2-20.15,16.5,40.3);
  ctx.strokeRect(0,PH/2-9.16,5.5,18.32);ctx.strokeRect(PW-5.5,PH/2-9.16,5.5,18.32);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(-2,PH/2-3.66,2,7.32);ctx.fillRect(PW,PH/2-3.66,2,7.32);
  ctx.strokeRect(-2,PH/2-3.66,2,7.32);ctx.strokeRect(PW,PH/2-3.66,2,7.32);
  const cur=sim.cur&&(sim.mode==='goalseq'||sim.mode==='celebrate')?sim.cur.scorer:null;
  const all=sim.all().slice().sort((p,q)=>p.y-q.y);
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const p of all){
    const col=p.pos==='GK'?'#facc15':TEAM_HEX[sim.teamIdx[p.team]];
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(p.x+0.4,p.y+1.5,1.7,0.8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,1.9,0,Math.PI*2);ctx.fill();
    ctx.lineWidth=p===sim.holder||p===cur?0.55:0.3;ctx.strokeStyle=p===sim.holder||p===cur?'#fde047':'#fff';ctx.stroke();
    ctx.fillStyle=p.pos==='GK'?'#1c1917':'#fff';ctx.font='bold 2.2px system-ui,sans-serif';ctx.fillText(p.no,p.x,p.y+0.1);
  }
  const lab=sim.holder||cur;
  if(lab){
    const n=lab.p.name,tw=n.length*1.15+2;
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(lab.x-tw/2,lab.y-6,tw,3);
    ctx.fillStyle='#fff';ctx.font='bold 2px system-ui,sans-serif';ctx.fillText(n,lab.x,lab.y-4.45);
  }
  const bl=sim.ball;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(bl.x+0.3,bl.y+0.9,0.9,0.4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.strokeStyle='#111';ctx.lineWidth=0.25;ctx.beginPath();ctx.arc(bl.x,bl.y,0.85,0,Math.PI*2);ctx.fill();ctx.stroke();
  if(sim.banner){
    const bn=sim.banner;
    ctx.fillStyle=bn.ti!==undefined?TEAM_HEX[sim.teamIdx[bn.ti]]:'rgba(0,0,0,.7)';ctx.globalAlpha=0.88;
    ctx.fillRect(-M,PH/2-10,PW+2*M,20);ctx.globalAlpha=1;
    ctx.fillStyle='#fff';ctx.font='bold 8px system-ui,sans-serif';ctx.fillText(bn.text,PW/2,PH/2-(bn.sub2?4.5:bn.sub?2.5:0));
    if(bn.sub){ctx.font='bold 3.6px system-ui,sans-serif';ctx.fillText(bn.sub,PW/2,PH/2+(bn.sub2?1.8:5));}
    if(bn.sub2){ctx.font='bold 3px system-ui,sans-serif';ctx.fillText(bn.sub2,PW/2,PH/2+6.2);}
  }
}

    sim.onTactics=()=>{const lb=$('lupbox');if(lb)lb.innerHTML=lineupHTML(sim,[h,a]);const tm=$('tacmsg');if(tm)tm.textContent="⚙️ Taktik güncellendi ("+Math.min(90,Math.floor(sim.clock))+"'): kalan dakikalar yeni diziliş gücüne göre oynanıyor";};
    const cv=$('pitch');let last=performance.now(),lastLog=-1;
    function frame(now){
      const dt=Math.min(0.05,(now-last)/1000);last=now;
      if(L.skip||sim.skipFlag)sim.skipToEnd();else sim.update(dt);
      const hs=$('hs');if(!hs){resolve();return;}
      hs.textContent=sim.score[0]+' – '+sim.score[1];
      $('clk').textContent=Math.min(90,Math.floor(sim.clock))+"'";
      if(sim.log.length!==lastLog){lastLog=sim.log.length;

      drawMatch(cv,sim);

    }

async function playWeek(){
  if(L.busy||L.week>=L.rounds.length)return;
  L.busy=true;L.skip=false;render();
  const round=L.rounds[L.week];
  for(let k=0;k<round.length;k++){
    const [h,a]=round[k];
    await preMatch(h,a,k,round.length);
    const res=simulateMatch(lineupOf(h).slots,lineupOf(a).slots); // taktik değişiklikleri maç öncesi sonuca yansır
    await playMatch2D(h,a,res,k,round.length);
    record(h,a,res);
  }
  L.week++;L.busy=false;L.sim=null;render();
}

  if(L.busy)return;
  while(L.week<L.rounds.length){for(const [h,a] of L.rounds[L.week])record(h,a,simulateMatch(lineupOf(h).slots,lineupOf(a).slots));L.week++;}
  render();
}

let TAC=null;
function shortName(n){const p=n.split(' ');return p.length>1?p.slice(1).join(' '):n;}
function tacEnts(){return lineupFromOrder(TAC.players,TAC.fm,TAC.order).slots;}
function openTactics(i){
  if(!A||A.managers[i].bot)return;
  if(ONL.on&&i!==ONL.mySeat)return;
  const players=teamPlayers(i),lu=lineupOf(i);
  const live=!!(L&&L.sim&&!L.sim.done&&L.busy&&!L.preGo&&L.sim.teamIdx&&L.sim.teamIdx.includes(i));
  TAC={i,players,fm:lu.form.slice(),order:lu.slots.map(e=>e.p.id),sel:null,live,base:lu};
  if(live)L.sim.paused=true;
  renderTactics();$('tmodal').hidden=false;
}
function renderTactics(){
  const T=TAC,m=A.managers[T.i],ents=tacEnts(),st=teamStats(ents),b=teamStats(T.base.slots);
  const start={GK:0,DEF:1,MID:1+T.fm[0],FWD:1+T.fm[0]+T.fm[1]},cnt={GK:1,DEF:T.fm[0],MID:T.fm[1],FWD:T.fm[2]};
  const ys={GK:90,DEF:70,MID:47,FWD:22};if(T.fm[1]===0){ys.DEF=64;ys.FWD=28;}
  let toks='';
  for(const role of ['FWD','MID','DEF','GK']){for(let j=0;j<cnt[role];j++){
    const k=start[role]+j,e=ents[k],x=(j+1)/(cnt[role]+1)*100,off=e.p.pos!==role;
    toks+=`<div class="tok ${T.sel===k?'sel':''} ${off?'off':''}" style="left:${x}%;top:${ys[role]}%" onclick="tapSlot(${k})"><div class="c">${Math.round(e.eff)}</div><div class="n">${esc(shortName(e.p.name))}</div>${off?`<div class="w">⚠ ${POS_TR[e.p.pos]}→${POS_TR[role]}</div>`:''}</div>`;}}
  const forms=uiFormations(T.players.length);
  const dl=(v,o)=>{const d=Math.round(v-o);return d===0?'':` <b style="color:${d>0?'var(--accent)':'var(--danger)'}">${d>0?'+':''}${d}</b>`;};
  const bar=(l,v,o)=>`<div>${l} <b>${Math.round(v)}</b>${dl(v,o)}</div><div class="bar"><i style="width:${clamp(v,0,100)}%"></i></div>`;
  const sel=T.sel===null?'Bir oyuncuya dokun, sonra yerini değiştireceğin oyuncuya dokun.':`Seçili: <b>${esc(ents[T.sel].p.name)}</b> · yer değiştireceğin oyuncuya dokun (aynısına tekrar dokunursan iptal).`;
  $('tmodal').innerHTML=`<div class="sheet"><h2 style="margin-bottom:6px"><span style="color:${COL[T.i]}">●</span> ${esc(m.name)} · Taktik ${T.live?'<span class="pill" style="background:var(--warn);color:#fff">⏸ maç duraklatıldı</span>':''}</h2>
    <div class="note" style="margin-bottom:6px">Formasyon (DEF-OS-FV):</div>
    <div class="row" style="gap:6px">${forms.map((f,k)=>`<button style="padding:8px 12px" class="${f.join()===T.fm.join()?'primary':''}" onclick="tacForm(${k})">${f.join('-')}</button>`).join('')}</div>
    <div class="tpitch" style="margin-top:10px"><div class="tl"></div><div class="tc"></div><div class="tb tbt"></div><div class="tb tbb"></div>${toks}</div>
    <p class="note" style="margin:8px 0">${sel}</p>
    <div class="grid" style="grid-template-columns:repeat(3,1fr);gap:10px">${bar('Genel',st.ovr,b.ovr)}${bar('Hücum',st.atk/0.75,b.atk/0.75)}${bar('Savunma',st.def/0.9,b.def/0.9)}</div>
    <p class="note" style="margin-top:6px">Daire içindeki sayı oyuncunun bu mevkideki <b>etkili puanı</b>; ⚠ doğal mevkisi dışında oynadığı anlamına gelir.${T.live?' Uygulayınca kalan dakikaların golleri yeni diziliş gücüne göre yeniden belirlenir.':''}</p>
    <div class="row" style="margin-top:10px"><button onclick="tacAuto()">🔄 Otomatik diz</button><button onclick="tacCancel()" style="margin-left:auto">İptal</button><button class="primary" onclick="tacApply()">✅ Uygula</button></div></div>`;
}
function tapSlot(k){
  if(!TAC)return;
  if(TAC.sel===null)TAC.sel=k;
  else if(TAC.sel===k)TAC.sel=null;
  else{const o=TAC.order,t=o[TAC.sel];o[TAC.sel]=o[k];o[k]=t;TAC.sel=null;}
  renderTactics();
}
function tacForm(k){if(!TAC)return;TAC.fm=uiFormations(TAC.players.length)[k].slice();TAC.order=autoOrder(TAC.players,TAC.fm);TAC.sel=null;renderTactics();}
function tacAuto(){if(!TAC)return;const b=buildLineup(TAC.players);TAC.fm=b.form.slice();TAC.order=b.slots.map(e=>e.p.id);TAC.sel=null;renderTactics();}
function closeTactics(){const t=TAC;TAC=null;$('tmodal').hidden=true;$('tmodal').innerHTML='';return t;}
function tacCancel(){const t=closeTactics();if(t&&t.live&&L&&L.sim)L.sim.paused=false;}
function tacApply(){
  const T=closeTactics();if(!T)return;
  const m=A.managers[T.i];m.tactic={fm:T.fm.slice(),order:T.order.slice()};delete m.lineup;
  if(ONL.on){if(ONL.role==='host')onlinePublish();else onlineSend({t:'tac',fm:T.fm.slice(),o:T.order.slice()},true);}
  if(T.live&&L&&L.sim&&!L.sim.done){const ix=L.sim.teamIdx;L.sim.pending=[lineupOf(ix[0]).slots,lineupOf(ix[1]).slots];L.sim.paused=false;}
  else if(L&&L.preRender)L.preRender();
  else if(!(L&&L.busy))render();
}

const KIND=['normal','long','pen'];
const ONL={on:false,role:null,code:null,name:'',phase:null,seats:[],mySeat:-1,myKey:null,nick:'',
  sid:Math.random().toString(36).slice(2,9),
  caps:{checked:false,db:false,room:false,user:false,owner:false,uid:null},db:null,room:null,rm:null,
  v:0,lobbies:[],hosted:[],pub:null,resDocs:{},unsubs:[],lastN:{},ready:{},watching:false,pendingRender:false,
  writing:false,dirty:false,err:'',peerKeys:new Set(),connSig:'',waitV:-1,actSeq:0,lobbyUnsub:null,lastLobby:'',

  transport:'claude',cdb:null,croom:null,ccaps:null};
const cleanNick=s=>String(s||'').replace(/[<>&"'`]/g,'').trim().slice(0,16);
const genCode=()=>{const c='abcdefghjkmnpqrstuvwxyz23456789';let s='';for(let i=0;i<5;i++)s+=c[Math.floor(Math.random()*c.length)];return s;};
const PH_TR={lobby:'lobide',auction:'açık artırmada',squads:'kadro kurulumunda',league:'ligde',closed:'kapandı'};
const canAct=t=>!ONL.on||ONL.mySeat===t;
const ackWait=()=>ONL.on&&ONL.role!=='host'&&ONL.waitV>=0&&!!ONL.pub&&ONL.waitV===ONL.pub.v;

async function onlineInit(){
  try{
    if(!(typeof window!=='undefined'&&window.claude&&window.claude.use)){ONL.caps.checked=true;ONL.ccaps=ONL.caps;refreshOnlineBox();refreshP2PBox();return;}
    const [db,room,user]=await Promise.all([window.claude.use('db'),window.claude.use('room'),window.claude.use('user')]);
    ONL.cdb=db||null;ONL.croom=room||null;
    ONL.ccaps={checked:true,db:!!db,room:!!room,user:!!user,owner:user?await user.isOwner():false,uid:user?await user.id():null};
    if(!ONL.on)useTransport('claude');
    if(db)subscribeLobbies();
    if(db&&ONL.ccaps.owner&&ONL.ccaps.uid)await loadHosted();
  }catch(e){ONL.caps.checked=true;if(!ONL.ccaps)ONL.ccaps=ONL.caps;}
  refreshOnlineBox();refreshP2PBox();
}
function refreshOnlineBox(){const b=$('onlbox');if(b&&screen==='setup'&&!ONL.on)b.innerHTML=onlineBoxHTML();}
function subscribeLobbies(){
  if(ONL.lobbyUnsub||!ONL.cdb)return;
  try{ONL.lobbyUnsub=ONL.cdb.collection('lobbies').onSnapshot(snap=>{
    ONL.lobbies=snap.docs.map(d=>d.data()).filter(g=>g&&g.code&&g.status!=='closed'&&Date.now()-(g.t||0)<12*3600e3).sort((a,b)=>(b.t||0)-(a.t||0));
    refreshOnlineBox();},()=>{});}catch(e){}
}
async function loadHosted(){
  try{
    const snap=await ONL.cdb.collection('data/users/'+ONL.ccaps.uid).get();
    ONL.hosted=snap.docs.filter(d=>d.id.indexOf('g_')===0).map(d=>d.data()).filter(g=>g&&g.code&&g.phase&&g.phase!=='closed').sort((a,b)=>(b.t||0)-(a.t||0));
  }catch(e){ONL.hosted=[];}
}

// ---------- Host: oda kurma ----------
async function onlineCreate(){
  const c=ONL.caps;
  if(!(c.owner&&ONL.db&&ONL.room&&c.uid)){alert('Online oyun kurmak için sayfanın sahibi olarak giriş yapmış olmalısın.');return;}
  const nick=cleanNick(ONL.nick);if(!nick){alert('Önce takma adını yaz.');return;}
  if(cfg.n<2){alert('En az 2 koltuk gerekli.');return;}
  let code=genCode();
  try{while((await ONL.db.doc('games/'+code).get()).exists)code=genCode();}catch(e){}
  ONL.on=true;ONL.role='host';ONL.code=code;ONL.nick=nick;ONL.name=nick+' · oyun';ONL.phase='lobby';ONL.mySeat=0;ONL.pub=null;
  ONL.seats=[...Array(cfg.n).keys()].map(i=>({bot:i>0&&!!cfg.bots[i],key:null,nick:i===0?nick:'',cn:(cfg.names[i]||'').trim().slice(0,16),host:i===0}));
  cfg.mode='auction';ONL.v=0;ONL.ready={};ONL.lastN={};ONL.peerKeys=new Set();ONL.connSig='';ONL.lastLobby='';
  try{ONL.rm=await ONL.room.join('tw-'+code);}catch(e){alert('Oda açılamadı: '+((e&&e.message)||e));cleanupOnline();return;}
  ONL.unsubs.push(ONL.rm.onPeers(()=>hostScan(),()=>{}));
  screen='olobby';render();onlinePublish();
}
// Misafirlerin presence'ını tarar: koltuk talepleri, hamleler, hazır bilgisi, bağlantı durumu
function hostScan(){
  if(ONL.role!=='host'||!ONL.rm)return;
  let changed=false;const keys=new Set();
  for(const p of ONL.rm.peers()){
    if(p.isMe||p.kind!=='viewer')continue;
    const pr=p.presence||{};if(pr.g!==ONL.code)continue;
    const key=p.by||p.peer;keys.add(key);ONL.peerKeys=keys;
    let si=ONL.seats.findIndex(s=>s.key===key);
    if(si<0&&pr.want){si=assignSeat(key,cleanNick(pr.nick));if(si>=0)changed=true;}
    if(si<0)continue;
    const a=pr.a;
    if(a&&typeof a==='object'){const mk=key+'|'+(a.s||'');if((ONL.lastN[mk]||0)<(a.n||0)){ONL.lastN[mk]=a.n;hostAct(si,a);}}
    if(pr.rdy!==undefined){
      const want=(L&&ONL.phase==='league'&&pr.rdy===L.week)?L.week:undefined; // önceki haftadan kalan eski bilgi sayılmaz
      if(ONL.ready[si]!==want){if(want===undefined)delete ONL.ready[si];else ONL.ready[si]=want;changed=true;}
    }
  }
  ONL.peerKeys=keys;
  const sig=[...keys].sort().join(',');if(sig!==ONL.connSig){ONL.connSig=sig;changed=true;}
  if(changed){if(screen==='olobby')render();onlinePublish();}
}
function assignSeat(key,nick){
  const S=ONL.seats;
  let i=S.findIndex((s,k)=>k>0&&!s.bot&&!s.key);
  if(i<0&&ONL.phase!=='lobby')i=S.findIndex((s,k)=>k>0&&!s.bot&&s.key&&!ONL.peerKeys.has(s.key)&&s.nick===nick);
  if(i<0)return -1;
  let n=nick||('Oyuncu '+(i+1)),base=n,c=2;
  while(S.some((s,k)=>k!==i&&s.nick===n))n=base+' '+(c++);
  S[i].key=key;S[i].nick=n;return i;
}
function hostAct(si,a){
  if(a.t==='tac'){if(ONL.phase!=='lobby')applyTactic(si,a.fm,a.o);return;}
  if(ONL.phase!=='auction'||!A||!A.lot)return;
  const lot=A.lot;if(lot.turn!==si||A.managers[si].bot)return;
  if(a.t==='bid'){if(lot.mystery&&lot.offer)return;if(placeBid(A,parseInt(a.v,10)))afterAuction();}
  else if(a.t==='pass'){if(lot.mystery&&lot.offer)return;passTurn(A);afterAuction();}
  else if(a.t==='myst'&&lot.mystery&&lot.offer){if(a.take)takeMystery(A);else declineMystery(A);afterAuction();}
}
function applyTactic(si,fm,order){
  if(!A)return;const m=A.managers[si];if(!m||m.bot)return;
  const t={fm:(Array.isArray(fm)?fm:[]).map(Number),order:(Array.isArray(order)?order:[]).map(Number)};
  if(!validTactic(t,teamPlayers(si)))return;
  m.tactic=t;delete m.lineup;onlinePublish();
}
function onlineStart(){
  if(ONL.role!=='host'||ONL.phase!=='lobby')return;
  ONL.seats.forEach((s,i)=>{if(i>0&&!s.bot&&!s.key)s.bot=true;}); // gelmeyen arkadaş koltukları bot olur
  cfg.n=ONL.seats.length;

async function onlinePlayWeek(){

function buildPub(){
  const o={v:++ONL.v,code:ONL.code,name:ONL.name,host:ONL.nick,hostBy:ONL.caps.uid||null,phase:ONL.phase,t:Date.now(),
    cfg:{n:ONL.seats.length,squad:cfg.squad,budget:cfg.budget,double:!!cfg.double,mystery:!!cfg.mystery},
    seats:ONL.seats.map(s=>({bot:!!s.bot,key:s.key||null,nick:s.nick||'',cn:s.cn||'',host:!!s.host})),
    conn:ONL.seats.map((s,i)=>!!(s.bot||i===0||(s.key&&ONL.peerKeys.has(s.key)))),ready:ONL.ready};
  if(A&&ONL.phase!=='lobby'){
    const lot=A.lot;
    o.A={managers:A.managers.map(m=>({name:m.name,bot:!!m.bot,budget:m.budget,squad:m.squad.slice()})),lotNo:A.lotNo,total:A.total,qn:A.queue.length,done:!!A.done,last:A.last||null,filled:A.filled?A.filled.length:0,
      lot:lot?{pid:lot.mystery?-1:lot.pid,bid:lot.bid,leader:lot.leader,active:lot.active.slice(),turn:lot.turn,mystery:!!lot.mystery,offer:!!lot.offer}:null};
    o.tactics=A.managers.map(m=>m.tactic||null);
  }
  if(L&&ONL.phase==='league')o.league={rounds:L.rounds,week:L.week};
  return o;
}
function lobbyDoc(o){const hum=o.seats.filter(s=>!s.bot).length,cl=o.seats.filter(s=>!s.bot&&(s.key||s.host)).length;
  return {code:o.code,name:o.name,host:o.host,n:o.seats.length,hum,claimed:cl,status:o.phase};}
function onlinePublish(){
  if(!ONL.on||ONL.role!=='host'||!ONL.db||ONL.closing)return;
  ONL.dirty=true;if(ONL.writing)return;ONL.writing=true;
  (async()=>{
    let fails=0;
    while(ONL.dirty&&!ONL.closing){
      ONL.dirty=false;
      try{
        const o=buildPub();
        await ONL.db.doc('games/'+ONL.code).set(o);
        const ld=lobbyDoc(o),sg=JSON.stringify(ld);
        if(sg!==ONL.lastLobby){await ONL.db.doc('lobbies/'+ONL.code).set(Object.assign({t:Date.now()},ld));ONL.lastLobby=sg;}
        saveSnapshotLater();fails=0;if(/^Yayın hatası/.test(ONL.err))ONL.err='';
      }catch(e){
        // hız sınırı vb. geçici hatalarda en güncel durumu geri çekilerek yeniden dene
        fails++;ONL.err='Yayın hatası: '+((e&&e.code)||'bilinmiyor');
        if(fails>=8)break;
        ONL.dirty=true;await new Promise(r=>setTimeout(r,Math.min(4000,600*fails)));
        continue;
      }
      if(ONL.dirty)await new Promise(r=>setTimeout(r,150));
    }
    ONL.writing=false;
  })();
}

function guestPeers(){
  if(!ONL.rm)return;
  const ps=ONL.rm.peers(),me=ps.find(p=>p.isMe&&p.sameTab);
  if(me)ONL.myKey=me.by||me.peer;
  const hp=ONL.pub?ps.some(p=>!p.isMe&&p.kind==='viewer'&&p.by&&p.by===ONL.pub.hostBy):false;
  let ch=false;
  if(ONL.pub){const ms=ONL.pub.seats.findIndex(s=>s.key&&s.key===ONL.myKey);if(ms!==ONL.mySeat){ONL.mySeat=ms;ch=true;if(ms>=0)ONL.rm.presence({want:null}).catch(()=>{});}}
  if(hp!==ONL.hostPresent){ONL.hostPresent=hp;ch=true;}
  if(ch&&!ONL.watching)render();
}
function onPubSnap(snap){
  if(!ONL.on||ONL.role==='host')return;
  if(!snap.exists){if(ONL.pub){ONL.err='Oyun odası kapandı.';alert('Oyun odası kapandı.');cleanupOnline();}else{ONL.err='Oyun bulunamadı (kapanmış olabilir).';render();}return;}
  const d=snap.data();
  if(/bulunamadı|bağlanılamadı/.test(ONL.err))ONL.err='';
  if(d.phase==='closed'){alert('Host oyun odasını kapattı.');cleanupOnline();return;}
  const sg=JSON.stringify(Object.assign({},d,{t:0}));if(sg===ONL.sig)return;ONL.sig=sg;
  ONL.pub=d;ONL.phase=d.phase;ONL.seats=d.seats;
  const ps=ONL.rm?ONL.rm.peers():[],me=ps.find(p=>p.isMe&&p.sameTab);if(me)ONL.myKey=me.by||me.peer;
  ONL.mySeat=d.seats.findIndex(s=>s.key&&s.key===ONL.myKey);
  if(ONL.mySeat>=0&&ONL.rm)ONL.rm.presence({want:null}).catch(()=>{});
  Object.assign(cfg,{n:d.cfg.n,squad:d.cfg.squad,budget:d.cfg.budget,double:d.cfg.double,mystery:d.cfg.mystery,mode:'auction'});
  if(d.A){
    A={mode:'auction',cfg,managers:d.A.managers.map((m,i)=>({name:m.name,bot:m.bot,budget:m.budget,squad:m.squad.slice(),tactic:(d.tactics&&d.tactics[i])||undefined})),
      queue:new Array(d.A.qn).fill(0),discarded:[],lot:d.A.lot,lotNo:d.A.lotNo,total:d.A.total,last:d.A.last,done:d.A.done,filled:new Array(d.A.filled||0).fill(0),rng:Math.random};
  }
  if(d.league){rebuildLeague(d.league.rounds);}
  if(ONL.waitV>=0&&ONL.waitV!==d.v)ONL.waitV=-1;
  const sc=d.phase==='lobby'?'olobby':d.phase==='auction'?'auction':d.phase==='squads'?'squads':'league';

}

  if(ONL.pub&&ONL.pub.league){rebuildLeague(ONL.pub.league.rounds);if(screen==='league'&&!ONL.watching)render();else if(ONL.watching)ONL.pendingRender=true;}
}
// Lig durumunu hafta belgelerinden baştan kurar (sonuçlar ve fikstür tüm istemcilerde aynıdır)
function rebuildLeague(rounds){
  if(!A||!rounds)return;
  const docs=Object.values(ONL.resDocs).filter(d=>d&&typeof d.w==='number').sort((x,y)=>x.w-y.w);
  const nl={rounds,week:0,table:newTable(A.managers.length),results:[],scorers:{},assisters:{},meta:[],busy:false,skip:false};
  const keep=L;L=nl;
  for(const d of docs){
    if(d.w!==L.week)break;
    L.meta[d.w]=[];
    d.m.forEach(m=>{
      const [h,a,hg,ag,ev,fh,oh,fa,oa]=m;
      record(h,a,{hg,ag,events:ev.map(e=>({min:e[0],side:e[1]?'a':'h',player:P(e[2]),assist:e[3]>=0?P(e[3]):null,kind:KIND[e[4]]||'normal'}))});
      L.meta[d.w].push({fh,oh,fa,oa});
    });
    L.week++;
  }
  if(keep&&keep.sim)L.sim=keep.sim;
}
function onlineSend(a,noWait){
  if(!ONL.rm)return;
  ONL.actSeq++;
  ONL.rm.presence({g:ONL.code,a:Object.assign({s:ONL.sid,n:ONL.actSeq},a)}).catch(()=>{});
  if(noWait)return;
  const v=ONL.pub?ONL.pub.v:-1;ONL.waitV=v;
  setTimeout(()=>{if(ONL.on&&ONL.waitV===v&&ONL.pub&&ONL.pub.v===v){ONL.waitV=-1;render();}},5000);
  render();
}

// ================= 🔗 HESAPSIZ ONLINE (WebRTC · kod paylaşımı) =================
// claude.ai hesabı gerekmez. Host ile arkadaşlar bağlantı kodlarını (WhatsApp vb.) birbirine yapıştırarak cihazdan cihaza bağlanır.
// Mevcut online motoru aynen kullanılır; yalnızca `db` ve `room` yerine WebRTC veri kanalı üzerinde çalışan bağdaştırıcılar takılır.
const RTC_CFG={iceServers:[
  {urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302','stun:global.stun.twilio.com:3478']},
  {urls:['turn:openrelay.metered.ca:80'],username:'openrelayproject',credential:'openrelayproject'}]};
const P2P={links:new Map(),n:0,g:null,gIn:'',gErr:'',hdb:null,hroom:null,gdb:null,groom:null,
  supported:()=>typeof RTCPeerConnection!=='undefined'};
function p2pEnc(o){const u=new TextEncoder().encode(JSON.stringify(o));let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return 'TW1.'+btoa(s);}
function p2pDec(t){
  const m=String(t||'').replace(/\s+/g,'').match(/TW1\.[A-Za-z0-9+\/=]+/);
  if(!m)throw new Error('Geçersiz kod: "TW1." ile başlayan kodu tamamen yapıştır.');
  try{const s=atob(m[0].slice(4)),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return JSON.parse(new TextDecoder().decode(u));}
  catch(e){throw new Error('Kod bozuk görünüyor; eksiksiz kopyaladığından emin ol.');}
}
const p2pSend=(dc,o)=>{try{if(dc&&dc.readyState==='open'){dc.send(JSON.stringify(o));return true;}}catch(e){}return false;};
const p2pBroadcast=o=>{for(const l of P2P.links.values())if(l.open)p2pSend(l.dc,o);};
function rtcGather(pc,ms){
  return new Promise(res=>{
    if(pc.iceGatheringState==='complete')return res();
    let done=false;const fin=()=>{if(!done){done=true;res();}};
    pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete')fin();});
    pc.addEventListener('icecandidate',e=>{if(!e.candidate)fin();});
    setTimeout(fin,ms||6000);
  });
}
// ---- yerel "veritabanı" (db arayüzüyle uyumlu): host yazar ve yayınlar, misafir yalnızca okur ----
function makeP2PDb(isHost){
  const docs=new Map(),subs=new Set(),segs=p=>p.split('/').filter(Boolean);
  const ls={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}},del:k=>{try{localStorage.removeItem(k);}catch(e){}}};
  if(isHost){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('twdb:')===0)docs.set(k.slice(5),localStorage.getItem(k));}}catch(e){}}
  const persist=p=>isHost&&/^(games|data)\//.test(p);
  const notify=path=>{for(const s of [...subs])if(s.match(path))Promise.resolve().then(()=>s.fire());};
  const snapDoc=path=>{const raw=docs.get(path);return {id:segs(path).pop(),exists:raw!==undefined,data:()=>raw!==undefined?JSON.parse(raw):undefined,metadata:{}};};
  const list=col=>{const n=segs(col).length;return [...docs.keys()].filter(k=>k.indexOf(col+'/')===0&&segs(k).length===n+1).sort();};
  const snapCol=col=>{const ds=list(col).map(snapDoc);return {docs:ds,size:ds.length,empty:!ds.length,docChanges:()=>[],metadata:{}};};
  const ro={code:'invalid_argument',message:'yazma yetkisi yok'};
  return {
    _put(path,raw){docs.set(path,raw);notify(path);},
    _del(path){docs.delete(path);notify(path);},
    _all(){return [...docs.entries()];},
    doc(path){
      if(segs(path).length%2)throw new TypeError('doc yolu çift parçalı olmalı: '+path);
      return {id:segs(path).pop(),path,
        async get(){return snapDoc(path);},
        async set(data){
          if(!isHost)throw ro;const raw=JSON.stringify(data);docs.set(path,raw);
          if(persist(path))ls.set('twdb:'+path,raw);
          if(path.indexOf('games/')===0)p2pBroadcast({k:'doc',p:path,d:data});
          notify(path);},
        async delete(){
          if(!isHost)throw ro;docs.delete(path);if(persist(path))ls.del('twdb:'+path);
          if(path.indexOf('games/')===0)p2pBroadcast({k:'del',p:path});notify(path);},
        onSnapshot(next){const sub={match:p=>p===path,fire:()=>{if(!sub.dead)next(snapDoc(path));}};subs.add(sub);Promise.resolve().then(()=>sub.fire());return ()=>{sub.dead=true;subs.delete(sub);};}};
    },
    collection(path){
      if(!(segs(path).length%2))throw new TypeError('collection yolu tek parçalı olmalı: '+path);
      const n=segs(path).length;
      return {path,async get(){return snapCol(path);},
        onSnapshot(next){const sub={match:p=>p.indexOf(path+'/')===0&&segs(p).length===n+1,fire:()=>{if(!sub.dead)next(snapCol(path));}};subs.add(sub);Promise.resolve().then(()=>sub.fire());return ()=>{sub.dead=true;subs.delete(sub);};}};
    }
  };
}
// ---- "oda" (presence) bağdaştırıcıları ----
function makeP2PRoomHost(){
  const handlers=new Set();
  const room={
    fire(){for(const h of [...handlers])Promise.resolve().then(()=>h({peers:room.peers(),joined:[],left:[],updated:[]}));},
    peers(){
      const a=[{peer:'p2p-host',by:'p2p-host',isMe:true,sameTab:true,kind:'viewer',guest:false,presence:{},updatedAt:0}];
      for(const l of P2P.links.values())if(l.open&&l.key)a.push({peer:l.key,by:null,isMe:false,sameTab:false,kind:'viewer',guest:true,presence:l.presence||{},updatedAt:l.updated||0});
      return a;},
    onPeers(h){handlers.add(h);Promise.resolve().then(()=>h({peers:room.peers(),joined:[],left:[],updated:[]}));return ()=>handlers.delete(h);},
    async presence(){},async join(){return room;},async leave(){}
  };
  return room;
}
function makeP2PRoomGuest(){
  const handlers=new Set(),mine={};
  const room={
    fire(){for(const h of [...handlers])Promise.resolve().then(()=>h({peers:room.peers(),joined:[],left:[],updated:[]}));},
    peers(){
      const g=P2P.g||{};
      const a=[{peer:g.key||'me',by:null,isMe:true,sameTab:true,kind:'viewer',guest:true,presence:mine,updatedAt:0}];
      if(g.open)a.push({peer:'p2p-host',by:'p2p-host',isMe:false,sameTab:false,kind:'viewer',guest:false,presence:{},updatedAt:0});
      return a;},
    onPeers(h){handlers.add(h);Promise.resolve().then(()=>h({peers:room.peers(),joined:[],left:[],updated:[]}));return ()=>handlers.delete(h);},
    async presence(patch){for(const k of Object.keys(patch)){if(patch[k]===null)delete mine[k];else mine[k]=patch[k];}p2pSend(P2P.g&&P2P.g.dc,{k:'pres',p:patch});},
    async join(){return room;},async leave(){}
  };
  return room;
}
// ---- taşıma katmanı seçimi: claude.ai platformu / hesapsız P2P ----
function useTransport(kind){
  if(kind==='p2p-host'){ONL.db=P2P.hdb;ONL.room=P2P.hroom;ONL.caps={checked:true,db:true,room:true,user:true,owner:true,uid:'p2p-host'};ONL.transport='p2p';}
  else if(kind==='p2p-guest'){ONL.db=P2P.gdb;ONL.room=P2P.groom;ONL.caps={checked:true,db:true,room:true,user:true,owner:false,uid:null};ONL.transport='p2p';}
  else{ONL.db=ONL.cdb||null;ONL.room=ONL.croom||null;ONL.caps=ONL.ccaps||{checked:ONL.caps.checked,db:false,room:false,user:false,owner:false,uid:null};ONL.transport='claude';}
}
function p2pCloseAll(){
  for(const l of P2P.links.values()){try{p2pSend(l.dc,{k:'bye'});}catch(e){}try{l.pc.close();}catch(e){}}
  P2P.links=new Map();
  if(P2P.g){try{p2pSend(P2P.g.dc,{k:'bye'});}catch(e){}try{P2P.g.pc&&P2P.g.pc.close();}catch(e){}P2P.g=null;}
  P2P.hdb=P2P.hroom=P2P.gdb=P2P.groom=null;
}
// ---------- Host ----------
async function p2pCreate(){
  if(!P2P.supported()){alert('Bu tarayıcı WebRTC desteklemiyor; hesapsız online kullanılamaz.');return;}
  if(ONL.on)return;
  P2P.hdb=makeP2PDb(true);P2P.hroom=makeP2PRoomHost();P2P.links=new Map();
  useTransport('p2p-host');
  await onlineCreate();
  if(!ONL.on){useTransport('claude');return;}
  openP2PPanel();await p2pHostNewLink();
}
async function p2pResume(code){
  if(!P2P.supported()||ONL.on)return;
  P2P.hdb=makeP2PDb(true);P2P.hroom=makeP2PRoomHost();P2P.links=new Map();
  useTransport('p2p-host');
  await onlineResume(code);
  if(!ONL.on){useTransport('claude');return;}
  openP2PPanel();await p2pHostNewLink();
}
function p2pHostedList(){
  const out=[];
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
    if(k&&k.indexOf('twdb:data/users/p2p-host/g_')===0){try{const g=JSON.parse(localStorage.getItem(k));if(g&&g.code&&g.phase&&g.phase!=='closed')out.push(g);}catch(e){}}}}catch(e){}
  return out.sort((a,b)=>(b.t||0)-(a.t||0));
}
async function p2pHostNewLink(){
  if(!(ONL.on&&ONL.role==='host'&&ONL.transport==='p2p'))return;
  const id='L'+(++P2P.n);
  const pc=new RTCPeerConnection(RTC_CFG),dc=pc.createDataChannel('tw',{ordered:true});
  const link={id,pc,dc,key:null,open:false,closed:false,answered:false,presence:{},updated:0,offer:'',ans:'',err:'',nick:''};
  P2P.links.set(id,link);
  dc.onopen=()=>{link.open=true;link.closed=false;link.err='';link.key='p'+Math.random().toString(36).slice(2,8);link.updated=Date.now();p2pLinkOpened(link);};
  dc.onclose=()=>p2pLinkClosed(link);
  dc.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}p2pHostMsg(link,m);};
  pc.addEventListener('connectionstatechange',()=>{if(pc.connectionState==='failed'||pc.connectionState==='closed')p2pLinkClosed(link);});
  refreshP2PPanel();
  try{
    await pc.setLocalDescription(await pc.createOffer());await rtcGather(pc);
    link.offer=p2pEnc({t:'o',s:pc.localDescription.sdp,k:id,g:ONL.code,n:ONL.nick,m:ONL.name});
  }catch(e){link.err='Davet kodu üretilemedi: '+((e&&e.message)||e);}
  refreshP2PPanel();
}
async function p2pHostAnswer(id){
  const l=P2P.links.get(id);if(!l)return;
  try{
    const d=p2pDec(l.ans);
    if(d.t!=='a'||d.k!==id)throw new Error('Bu yanıt kodu bu davete ait değil; doğru satırın yanıt kodunu yapıştır.');
    await l.pc.setRemoteDescription({type:'answer',sdp:d.s});l.answered=true;l.err='';
    setTimeout(()=>{if(!l.open&&!l.closed&&P2P.links.get(id)===l){l.err='Bağlantı kurulamadı: ağ (ör. mobil operatör) doğrudan bağlantıyı engelliyor olabilir. Arkadaşın Wi-Fi\'a geçerek yeniden denesin.';refreshP2PPanel();}},30000);
  }catch(e){l.err=(e&&e.message)||'Geçersiz kod';}
  refreshP2PPanel();
}
function p2pRemoveLink(id){const l=P2P.links.get(id);if(l){try{l.pc.close();}catch(e){}P2P.links.delete(id);if(ONL.rm&&ONL.rm.fire)ONL.rm.fire();}refreshP2PPanel();}
function p2pLinkOpened(link){
  // yeni bağlanan misafire mevcut oyun belgelerini gönder, sonra hoş geldin mesajı
  if(ONL.db&&ONL.db._all)for(const [path,raw] of ONL.db._all())if(path.indexOf('games/'+ONL.code)===0)p2pSend(link.dc,{k:'doc',p:path,d:JSON.parse(raw)});
  p2pSend(link.dc,{k:'welcome',key:link.key,code:ONL.code,host:ONL.nick});
  if(ONL.rm&&ONL.rm.fire)ONL.rm.fire();
  refreshP2PPanel();if(screen==='olobby')render();
}
function p2pLinkClosed(link){
  if(link.closed)return;const was=link.open;link.open=false;link.closed=true;
  if(was&&ONL.on){if(ONL.rm&&ONL.rm.fire)ONL.rm.fire();if(screen==='olobby')render();}
  refreshP2PPanel();
}
function p2pHostMsg(link,m){
  if(m.k==='pres'&&m.p&&typeof m.p==='object'){
    for(const k of Object.keys(m.p)){if(m.p[k]===null)delete link.presence[k];else link.presence[k]=m.p[k];}
    if(typeof m.p.nick==='string')link.nick=cleanNick(m.p.nick);
    link.updated=Date.now();if(ONL.rm&&ONL.rm.fire)ONL.rm.fire();
  }
}
// ---------- Misafir ----------
async function p2pGuestStart(){
  const nick=cleanNick(ONL.nick);
  if(!nick){alert('Önce takma adını yaz.');const i=$('onick');if(i&&i.focus)i.focus();return;}
  if(!P2P.supported()){P2P.gErr='Bu tarayıcı WebRTC desteklemiyor.';refreshP2PBox();return;}
  let d;try{d=p2pDec(P2P.gIn);if(d.t!=='o')throw new Error('Bu bir davet kodu değil; host\'un gönderdiği "davet" kodunu yapıştır.');}
  catch(e){P2P.gErr=e.message;refreshP2PBox();return;}
  P2P.gErr='';
  const g=P2P.g={state:'answering',pc:null,dc:null,open:false,key:null,answer:'',code:d.g,hostNick:d.n||'',gameName:d.m||''};
  P2P.gdb=makeP2PDb(false);P2P.groom=makeP2PRoomGuest();
  refreshP2PBox();
  try{
    const pc=g.pc=new RTCPeerConnection(RTC_CFG);
    pc.ondatachannel=e=>{
      const dc=g.dc=e.channel;
      dc.onopen=()=>{g.open=true;g.state='open';refreshP2PBox();};
      dc.onclose=()=>p2pGuestClosed(g);
      dc.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(_){return;}p2pGuestMsg(g,m);};
    };
    pc.addEventListener('connectionstatechange',()=>{if(pc.connectionState==='failed'){g.state='error';P2P.gErr='Bağlantı kurulamadı: ağ doğrudan bağlantıyı engelliyor olabilir. Wi-Fi ile yeniden dene.';refreshP2PBox();}else if(pc.connectionState==='closed')p2pGuestClosed(g);});
    await pc.setRemoteDescription({type:'offer',sdp:d.s});
    await pc.setLocalDescription(await pc.createAnswer());await rtcGather(pc);
    g.answer=p2pEnc({t:'a',s:pc.localDescription.sdp,k:d.k});if(g.state==='answering')g.state='waiting';
  }catch(e){g.state='error';P2P.gErr='Yanıt kodu üretilemedi: '+((e&&e.message)||e);}
  refreshP2PBox();
}
function p2pGuestMsg(g,m){
  if(m.k==='doc'&&P2P.gdb)P2P.gdb._put(m.p,JSON.stringify(m.d));
  else if(m.k==='del'&&P2P.gdb)P2P.gdb._del(m.p);
  else if(m.k==='welcome'){
    g.key=m.key;useTransport('p2p-guest');
    if(P2P.groom&&P2P.groom.fire)P2P.groom.fire();
    onlineJoin(m.code);
  }
  else if(m.k==='bye'){p2pGuestClosed(g);}
}
function p2pGuestClosed(g){
  if(!P2P.g||P2P.g!==g||g.gone)return;g.gone=true;g.open=false;
  if(ONL.on&&ONL.transport==='p2p'&&ONL.role!=='host'){alert('Host ile bağlantı koptu. Yeniden katılmak için yeni bir davet/yanıt kodu alışverişi gerekir.');cleanupOnline();}
  else{P2P.g=null;refreshP2PBox();}
}
function p2pGuestCancel(){if(P2P.g){try{P2P.g.pc&&P2P.g.pc.close();}catch(e){}}P2P.g=null;P2P.gdb=P2P.groom=null;P2P.gErr='';refreshP2PBox();}
// ---------- Arayüz ----------
function p2pCopy(id){
  const t=$(id);if(!t)return;
  const fb=()=>{try{t.focus();t.select();if(t.setSelectionRange)t.setSelectionRange(0,t.value.length);document.execCommand('copy');}catch(e){}};
  try{if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).catch(fb);return;}}catch(e){}
  fb();
}
function p2pShare(id){
  const t=$(id);if(!t)return;
  try{if(typeof navigator!=='undefined'&&navigator.share){navigator.share({text:t.value}).catch(()=>p2pCopy(id));return;}}catch(e){}
  p2pCopy(id);
}
function refreshP2PBox(){const b=$('p2pbox');if(b&&screen==='setup'&&!ONL.on)b.innerHTML=p2pBoxHTML();}
function refreshP2PPanel(){const m=$('pmodal');if(m&&!m.hidden)m.innerHTML=p2pPanelHTML();}

function p2pPanelHTML(){
  const rows=[...P2P.links.values()].map(l=>{
    const st=l.open?`✅ Bağlı${l.nick?' · '+esc(l.nick):''}`:l.closed?'❌ Koptu':l.answered?'⏳ Bağlanıyor…':'⏳ Yanıt kodu bekleniyor';
    const body=(!l.open&&!l.closed)?`<div class="note">1) Bu <b>davet kodunu</b> arkadaşına gönder:</div>
      <textarea id="off_${l.id}" readonly rows="3" style="width:100%;font-size:.7rem" onfocus="this.select()">${esc(l.offer||'Kod hazırlanıyor…')}</textarea>
      <div class="row"><button onclick="p2pCopy('off_${l.id}')">📋 Kopyala</button><button onclick="p2pShare('off_${l.id}')">📤 Paylaş</button></div>
      <div class="note" style="margin-top:8px">2) Arkadaşının sana gönderdiği <b>yanıt kodunu</b> yapıştır:</div>
      <textarea id="ans_${l.id}" rows="3" style="width:100%;font-size:.7rem" placeholder="TW1.…" oninput="P2P.links.get('${l.id}').ans=this.value">${esc(l.ans)}</textarea>
      <div class="row"><button class="primary" onclick="p2pHostAnswer('${l.id}')">🔗 Bağla</button></div>`:'';
    return `<div class="card" style="margin:8px 0"><div class="row" style="justify-content:space-between"><b>Davet ${esc(l.id)}</b><span>${st}</span></div>${body}
      ${l.err?`<p class="note" style="color:var(--danger)">${esc(l.err)}</p>`:''}<div class="row" style="margin-top:6px"><button onclick="p2pRemoveLink('${l.id}')">Sil</button></div></div>`;
  }).join('');
  return `<div class="sheet"><h2>🔗 Arkadaş bağla</h2>
    <p class="note">Her arkadaş için bir davet gerekir: davet kodunu ona gönder, o sayfayı açıp "Kodla katıl"a yapıştırarak yanıt kodu üretsin, yanıtı sana göndersin, sen buraya yapıştır. Bağlanınca koltuk otomatik atanır. Birisi koparsa yeni davet üret.</p>
    <button class="primary" onclick="p2pHostNewLink()">➕ Yeni davet kodu</button>${rows}
    <div class="row" style="margin-top:12px"><button onclick="closeP2PPanel()" style="margin-left:auto">Kapat</button></div></div>`;
}

render();
onlineInit();
</script>
</body>
</html>
