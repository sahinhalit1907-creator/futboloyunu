<style>
:root{
  --bg:#f3f6f4;--card:#ffffff;--text:#14201a;--muted:#5d6b63;--line:#dfe6e1;
  --accent:#16a34a;--accent-ink:#ffffff;--accent-soft:#dcfce7;--warn:#d97706;--danger:#dc2626;--gold:#eab308;
  --c0:#2563eb;--c1:#dc2626;--c2:#9333ea;--c3:#ea580c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1511;--card:#17211b;--text:#e8f0ea;--muted:#9aa9a0;--line:#26332b;--accent:#22c55e;--accent-ink:#04210f;--accent-soft:#12301d;}
}
:root[data-theme="dark"]{--bg:#0e1511;--card:#17211b;--text:#e8f0ea;--muted:#9aa9a0;--line:#26332b;--accent:#22c55e;--accent-ink:#04210f;--accent-soft:#12301d;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.45;min-height:100%}
#app{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:4px 0 2px}
h2{font-size:1.15rem;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
label{display:block;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=number]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem}
input[type=range]{width:100%;accent-color:var(--accent)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 16px;border-radius:10px;font-weight:600}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--danger)}
.seg button{flex:1}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.big{font-size:2rem;font-weight:800}
.muted{color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.75rem;font-weight:700;background:var(--accent-soft);color:var(--text)}
.pos-GK{background:#fde68a;color:#422006}.pos-DEF{background:#bfdbfe;color:#0c1f4a}.pos-MID{background:#bbf7d0;color:#052e16}.pos-FWD{background:#fecaca;color:#450a0a}
.lot{text-align:center;padding:22px 12px}
.lot .name{font-size:1.8rem;font-weight:800;margin:6px 0}
.ovr{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:1.7rem;font-weight:800}
.bid{font-size:2.4rem;font-weight:900;color:var(--accent)}
.mgr{border-left:5px solid var(--line)}
.mgr.turn{outline:2px solid var(--accent)}
.mgr small{display:block;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chips span{font-size:.78rem;padding:2px 7px;border-radius:99px;border:1px solid var(--line)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:3px 0 8px}
.bar>i{display:block;height:100%;background:var(--accent)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th:nth-child(2),td:nth-child(2){text-align:left}
tr.first td{font-weight:800;background:var(--accent-soft)}
.match{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.match b{min-width:54px;text-align:center}
.live{min-height:0}
.live .score{font-size:1.8rem;font-weight:900;text-align:center}
.ev{padding:3px 0}
.champ{text-align:center;padding:26px 12px;background:linear-gradient(135deg,var(--accent-soft),var(--card));border-color:var(--accent)}
.champ .big{font-size:2.3rem}
.note{font-size:.9rem;color:var(--muted)}
.banner{padding:10px 12px;border-radius:10px;background:var(--accent-soft);margin-bottom:12px;font-weight:600}
.banner.no{background:#fee2e2;color:#450a0a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .banner.no{background:#3b1414;color:#fecaca}}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}
.hud .sc{font-size:1.9rem}
canvas#pitch{width:100%;display:block;border-radius:10px;background:#2e7d32;margin:6px 0}
#evlog{min-height:1.4em}
.spd button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:.72rem;font-weight:800}
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;font-size:.88rem}
.lineup div.l{display:flex;align-items:center;gap:6px;padding:2px 0}
details summary{cursor:pointer;font-weight:600}
</style>

// Mevki uyumu: FIT[doğalMevki][oynadığıMevki] -> performans çarpanı
const FIT={
  GK:{GK:1,DEF:.5,MID:.45,FWD:.3},
  DEF:{GK:.5,DEF:1,MID:.88,FWD:.75},
  MID:{GK:.4,DEF:.88,MID:1,FWD:.9},
  FWD:{GK:.3,DEF:.72,MID:.9,FWD:1}};
const BASE_FORM={3:[1,0,1],4:[1,1,1],5:[2,1,1],6:[2,2,1],7:[2,2,2],8:[3,2,2],9:[3,3,2],10:[3,4,2],11:[4,3,3]};
const ROLE_ORDER={GK:0,DEF:1,MID:2,FWD:3};
const atkRole=(e,r)=>r==='FWD'?e:r==='MID'?e*0.85:r==='DEF'?e*0.35:e*0.1;
const defRole=(e,r)=>r==='FWD'?e*0.4:r==='MID'?e*0.75:r==='DEF'?e:e*1.05;
function formations(n){const o=[];for(let d=1;d<=5;d++)for(let m=(n>=4?1:0);m<=5;m++)for(let f=1;f<=3;f++)if(1+d+m+f===n)o.push([d,m,f]);return o;}
// Oyuncuları slotlara en yüksek toplam etkili puanla yerleştirir (bitmask DP)
function bestAssign(players,slots){
  const n=players.length,size=1<<n,dp=new Float64Array(size).fill(-1e9),from=new Int16Array(size).fill(-1),pc=new Uint8Array(size);
  for(let m=1;m<size;m++)pc[m]=pc[m>>1]+(m&1);
  dp[0]=0;
  for(let mask=0;mask<size;mask++){
    if(dp[mask]<-1e8)continue;const i=pc[mask];if(i>=n)continue;
    for(let sl=0;sl<n;sl++){if(mask&(1<<sl))continue;
      const v=dp[mask]+players[i].ovr*FIT[players[i].pos][slots[sl]],nm=mask|(1<<sl);
      if(v>dp[nm]){dp[nm]=v;from[nm]=sl;}}
  }
  const assign=new Array(n);let mask=size-1;
  for(let i=n-1;i>=0;i--){const sl=from[mask];assign[i]=sl;mask^=1<<sl;}
  return {total:dp[size-1],assign};
}
// Kadroya en uygun dizilişi seçer; mevkisi uymayanları gerekli yerlere kaydırır
function buildLineup(players){
  const n=players.length,base=BASE_FORM[n]||BASE_FORM[11];let best=null;
  for(const fm of formations(n)){
    const slots=['GK',...Array(fm[0]).fill('DEF'),...Array(fm[1]).fill('MID'),...Array(fm[2]).fill('FWD')];
    const r=bestAssign(players,slots);
    const score=r.total-1.5*(Math.abs(fm[0]-base[0])+Math.abs(fm[1]-base[1])+Math.abs(fm[2]-base[2]));
    if(!best||score>best.score)best={score,fm,slots,assign:r.assign};
  }
  const ents=players.map((p,i)=>{const role=best.slots[best.assign[i]];return {p,role,eff:p.ovr*FIT[p.pos][role]};});
  ents.sort((x,y)=>ROLE_ORDER[x.role]-ROLE_ORDER[y.role]||y.eff-x.eff);
  return {form:best.fm,label:best.fm.join('-'),slots:ents};
}
function teamStats(ents){
  if(!ents.length)return {atk:1,def:1,ovr:0};
  const n=ents.length;
  return {atk:ents.reduce((s,e)=>s+atkRole(e.eff,e.role),0)/n,def:ents.reduce((s,e)=>s+defRole(e.eff,e.role),0)/n,ovr:ents.reduce((s,e)=>s+e.eff,0)/n};
}
function poisson(l,rng=Math.random){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=rng();}while(p>L);return k-1;}
function lambda(att,def){return clamp(0.78*Math.pow((att.atk/def.def)/0.8,3),0.15,4.5);}
// Gol türü: normal (ceza sahası içi), uzaktan şut, penaltı
function pickKind(rng){const r=rng();return r<0.07?'pen':r<0.2?'long':'normal';}
function pickScorer(ents,rng,kind){
  let w;
  if(kind==='pen')w=ents.map(e=>e.role==='GK'?0:Math.pow(e.eff,6));
  else{const bo=kind==='long'?{FWD:1,MID:2.2,DEF:1.7,GK:0.2}:{FWD:1,MID:1,DEF:1,GK:1};
    w=ents.map(e=>Math.pow(atkRole(e.eff,e.role),3)*bo[e.role]);}
  const t=w.reduce((a,b)=>a+b,0);let r=rng()*t;
  for(let i=0;i<ents.length;i++){r-=w[i];if(r<=0)return ents[i].p;}
  return ents[ents.length-1].p;
}
// Asist: orta saha > forvet > defans ağırlıklı, golü atan hariç
function pickAssister(ents,scorer,rng,prob){
  if(rng()>prob)return null;
  const cand=ents.filter(e=>e.p.id!==scorer.id);if(!cand.length)return null;
  const w=cand.map(e=>(e.role==='MID'?1:e.role==='FWD'?0.85:e.role==='DEF'?0.4:0.03)*Math.pow(e.eff,3)),t=w.reduce((a,b)=>a+b,0);let r=rng()*t;
  for(let i=0;i<cand.length;i++){r-=w[i];if(r<=0)return cand[i].p;}
  return cand[cand.length-1].p;
}
function mkEvent(side,ents,rng){
  const kind=pickKind(rng),pl=pickScorer(ents,rng,kind);
  const as=kind==='pen'?null:pickAssister(ents,pl,rng,kind==='long'?0.4:0.78);
  return {min:1+Math.floor(rng()*90),side,player:pl,assist:as,kind};
}
function simulateMatch(homeEnts,awayEnts,rng=Math.random){
  const hs=teamStats(homeEnts),as=teamStats(awayEnts);
  const hg=poisson(lambda(hs,as),rng),ag=poisson(lambda(as,hs),rng);
  const events=[];
  for(let i=0;i<hg;i++)events.push(mkEvent('h',homeEnts,rng));
  for(let i=0;i<ag;i++)events.push(mkEvent('a',awayEnts,rng));
  events.sort((a,b)=>a.min-b.min);
  return {hg,ag,events};
}
function buildRounds(n,double){
  const ids=[...Array(n).keys()];if(n%2)ids.push(-1);
  const m=ids.length,rounds=[];let arr=ids.slice();
  for(let r=0;r<m-1;r++){
    const round=[];
    for(let i=0;i<m/2;i++){const a=arr[i],b=arr[m-1-i];if(a>=0&&b>=0)round.push(r%2?[b,a]:[a,b]);}
    rounds.push(round);
    arr=[arr[0],arr[m-1],...arr.slice(1,m-1)];
  }
  if(double)rounds.push(...rounds.map(rd=>rd.map(([a,b])=>[b,a])));
  return rounds;
}
function newTable(n){return [...Array(n).keys()].map(i=>({i,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));}
function applyResult(table,h,a,hg,ag){
  const H=table[h],A=table[a];
  H.p++;A.p++;H.gf+=hg;H.ga+=ag;A.gf+=ag;A.ga+=hg;
  if(hg>ag){H.w++;A.l++;H.pts+=3;}else if(hg<ag){A.w++;H.l++;A.pts+=3;}else{H.d++;A.d++;H.pts++;A.pts++;}
}
function sortTable(t){return t.slice().sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||x.i-y.i);}

// ---- Açık artırma motoru ----
function maxBid(A,i){const m=A.managers[i],left=A.cfg.squad-m.squad.length;return left<=0?0:m.budget-(left-1);}
function makeManagers(cfg,rng){
  const BOT_NAMES=['Robo Hoca','Kaptan Bot','Mister Metal','Algoritma Hoca','Çelik Teknik','Taktik Makinesi','Hesap Hoca','Pres Bot','Kontra Bot','Libero Bot','Golcü Bot','Kanat Bot','Maestro Bot','Pivot Bot','Savaş Bot','Şampiyon Bot'];
  return cfg.names.slice(0,cfg.n).map((nm,i)=>{
    const bot=!!(cfg.bots&&cfg.bots[i]),base=(nm||'').trim()||(bot?BOT_NAMES[i%BOT_NAMES.length]:('Oyuncu '+(i+1)));
    return {name:bot?'🤖 '+base:base,bot,aggr:0.85+rng()*0.35,budget:cfg.budget,squad:[]};});
}
// Havuz: her mevkiden herkesin dengeli kadro kurmasına yetecek kadar (+ biraz fazla) futbolcu garanti edilir
function buildPool(cfg,rng){
  const bf=BASE_FORM[cfg.squad]||BASE_FORM[11],tgt={GK:1,DEF:bf[0],MID:bf[1],FWD:bf[2]},extra=Math.max(1,Math.round(cfg.n/2));
  const chosen=[];
  for(const k of ['GK','DEF','MID','FWD']){const ids=shuffle(PLAYERS.filter(p=>p.pos===k).map(p=>p.id),rng);chosen.push(...ids.slice(0,cfg.n*tgt[k]+extra));}
  const chosenSet=new Set(chosen),rest=shuffle(PLAYERS.map(p=>p.id).filter(id=>!chosenSet.has(id)),rng);
  const poolSize=Math.min(PLAYERS.length,Math.max(chosen.length,cfg.n*cfg.squad+Math.max(6,cfg.n*3)));
  return shuffle(chosen.concat(rest.slice(0,Math.max(0,poolSize-chosen.length))),rng);
}
function newAuction(cfg,rng=Math.random){
  const managers=makeManagers(cfg,rng),queue=buildPool(cfg,rng);
  const A={mode:'auction',cfg,managers,queue,discarded:[],lot:null,lotNo:0,last:null,done:false,total:queue.length,rng};
  startLot(A);return A;
}
// ---- Hızlı seçim (açık artırmasız): sırayla önüne rastgele bir futbolcu gelir, "evet" al / "hayır" pas ----
// Herkesin (insan ve bot) pas hakkı eşittir. Hakkı biten kişiye yalnızca ihtiyacı olan mevkilerden oyuncu gelir.
function newDraft(cfg,rng=Math.random){
  const managers=makeManagers(cfg,rng),pool=buildPool(cfg,rng),pm=cfg.passMult||2;
  managers.forEach(m=>{m.passMax=pm*cfg.squad;m.passes=m.passMax;m.seen=new Set();});
  const D={mode:'draft',cfg,managers,pool,rng,turn:0,cur:null,done:false,last:null,lastHuman:null,log:[],total:pool.length};
  draftAdvance(D);return D;
}
function draftDraw(D,i){
  const m=D.managers[i];
  let c=D.pool.filter(id=>!m.seen.has(id));
  if(m.passes<=0){const nd=needsOf(D,i),c2=D.pool.filter(id=>nd[PLAYERS[id].pos]>0);if(c2.length)c=c2;}
  if(!c.length){m.seen.clear();c=D.pool.slice();}
  if(!c.length){const used=new Set(D.managers.flatMap(x=>x.squad));c=PLAYERS.map(p=>p.id).filter(id=>!used.has(id));}
  D.cur=c[Math.floor(D.rng()*c.length)];
}
function draftNextTurn(D){D.turn=(D.turn+1)%D.managers.length;}
function draftTake(D,byBot){
  const i=D.turn,m=D.managers[i],pid=D.cur;if(pid==null)return false;
  m.squad.push(pid);const k=D.pool.indexOf(pid);if(k>=0)D.pool.splice(k,1);
  const ev={who:i,pid,took:true};D.last=ev;if(byBot){D.log.push(ev);if(D.log.length>40)D.log.shift();}else D.lastHuman=ev;
  D.cur=null;draftNextTurn(D);return true;
}
function draftPass(D,byBot){
  const i=D.turn,m=D.managers[i],pid=D.cur;if(pid==null||m.passes<=0)return false;
  m.passes--;m.seen.add(pid);const ev={who:i,pid,took:false};D.last=ev;if(!byBot)D.lastHuman=ev;
  D.cur=null;draftNextTurn(D);return true;
}
// Botun kararı: ihtiyacı olmayan mevkiyi geçer; ihtiyaç varsa puan, kalan pas hakkına göre değişen çıtayı aşıyorsa alır
function draftBotTake(D,i){
  const m=D.managers[i],p=PLAYERS[D.cur],need=needsOf(D,i);
  if(m.passes<=0)return true;
  if(need[p.pos]<=0)return false;
  const same=D.pool.filter(id=>PLAYERS[id].pos===p.pos),mean=same.reduce((s,id)=>s+PLAYERS[id].ovr,0)/Math.max(1,same.length);
  const thr=mean+(m.passes/m.passMax)*5-1.5+(m.aggr-1)*2;
  return p.ovr>=thr;
}
// Sıra bir insana gelene (ya da seçim bitene) kadar botların hamlelerini anında oynatır
function draftAdvance(D){
  let guard=0;
  while(!D.done&&guard++<200000){
    if(D.managers.every(m=>m.squad.length>=D.cfg.squad)){D.done=true;D.cur=null;return;}
    const i=D.turn,m=D.managers[i];
    if(m.squad.length>=D.cfg.squad){draftNextTurn(D);D.cur=null;continue;}
    if(D.cur==null)draftDraw(D,i);
    if(!m.bot)return;
    if(draftBotTake(D,i))draftTake(D,true);else draftPass(D,true);
  }
}
const MYST_MIN=85; // sürpriz kartlardan çıkabilecek en düşük puan
function startLot(A){
  if(A.managers.every(m=>m.squad.length>=A.cfg.squad)){A.done=true;A.lot=null;return;}
  if(!A.queue.length){fillRemaining(A);return;}
  const n=A.managers.length;
  const active=A.managers.map((m,i)=>i).filter(i=>maxBid(A,i)>=1);
  // 🎁 Sürpriz kart: ara sıra gizli bir YILDIZ (85+) gelir. Sırası gelen 1 TL'ye körlemesine alabilir, almazsa diğerleri açık artırır.
  let pid,myst=false;
  if(!!A.cfg.mystery&&A.lotNo>=1&&!A.lastMyst&&active.length>=2&&A.rng()<0.16){
    const k=A.queue.findIndex(id=>PLAYERS[id].ovr>=MYST_MIN);
    if(k>=0){pid=A.queue.splice(k,1)[0];myst=true;}
  }
  if(!myst)pid=A.queue.shift();
  A.lotNo++;
  A.lastMyst=myst;
  A.lot={pid,bid:0,leader:-1,active,turn:-1,mystery:myst,offer:myst};
  settle(A,(((A.lotNo-2)%n)+n)%n);
}
function settle(A,from){
  const lot=A.lot,n=A.managers.length;
  lot.active=lot.active.filter(i=>i===lot.leader||maxBid(A,i)>lot.bid);
  if(lot.leader>=0&&lot.active.length===1){
    const m=A.managers[lot.leader];m.squad.push(lot.pid);m.budget-=lot.bid;
    A.last={pid:lot.pid,who:lot.leader,price:lot.bid,sold:true};A.lot=null;startLot(A);return;
  }
  if(lot.leader<0&&lot.active.length===0){
    A.discarded.push(lot.pid);A.last={pid:lot.pid,sold:false};A.lot=null;startLot(A);return;
  }
  for(let k=1;k<=n;k++){const i=(from+k)%n;if(lot.active.includes(i)&&i!==lot.leader){lot.turn=i;return;}}
}
function placeBid(A,amount){
  const lot=A.lot;if(!lot)return false;
  if(!Number.isInteger(amount)||amount<=lot.bid||amount>maxBid(A,lot.turn))return false;
  lot.bid=amount;lot.leader=lot.turn;settle(A,lot.turn);return true;
}
function passTurn(A){
  const lot=A.lot;if(!lot)return;
  const t=lot.turn;lot.active=lot.active.filter(i=>i!==t);settle(A,t);
}
// Sürpriz kartı sıradaki oyuncu 1 TL'ye alır
function takeMystery(A){
  const lot=A.lot;if(!lot||!lot.mystery||!lot.offer)return false;
  const t=lot.turn;if(maxBid(A,t)<1)return false;
  const m=A.managers[t];m.squad.push(lot.pid);m.budget-=1;
  A.last={pid:lot.pid,who:t,price:1,sold:true,mystery:true};A.lot=null;startLot(A);return true;
}
// Sıradaki oyuncu istemez: futbolcu gizli kalarak açık artırmaya çıkar, o oyuncu bu lot için turdan çıkar
function declineMystery(A){
  const lot=A.lot;if(!lot||!lot.mystery||!lot.offer)return false;
  const t=lot.turn;lot.offer=false;lot.active=lot.active.filter(i=>i!==t);settle(A,t);return true;
}
function fillRemaining(A){
  const pool=shuffle([...A.queue,...A.discarded],A.rng);A.queue=[];A.filled=[];
  A.managers.forEach((m,i)=>{while(m.squad.length<A.cfg.squad&&pool.length){const pid=pool.pop();m.squad.push(pid);A.filled.push({pid,who:i});}});
  A.done=true;A.lot=null;
}
// ---- Bot mantığı ----
// Bir yöneticinin hâlâ doldurması gereken mevki sayıları (hedef diziliş: 1 KL + BASE_FORM)
function needsOf(A,i){
  const bf=BASE_FORM[A.cfg.squad]||BASE_FORM[11],target={GK:1,DEF:bf[0],MID:bf[1],FWD:bf[2]};
  const have={GK:0,DEF:0,MID:0,FWD:0};A.managers[i].squad.forEach(id=>have[PLAYERS[id].pos]++);
  const u={};for(const k of ['GK','DEF','MID','FWD'])u[k]=Math.max(0,target[k]-have[k]);return u;
}
// Bir botun bu futbolcuya biçtiği değer. Mevkisi kadroda ihtiyaç değilse 0 (pas), ancak
// havuzda ihtiyaçlarını karşılayacak kadar oyuncu kalmadıysa yedek plan olarak düşük değer biçer.
function botValue(A,i,p){
  const m=A.managers[i],left=A.cfg.squad-m.squad.length;if(left<=0)return 0;
  const unmet=needsOf(A,i),remain=[p.id,...A.queue].map(id=>PLAYERS[id]);
  const avail={GK:0,DEF:0,MID:0,FWD:0};remain.forEach(r=>avail[r.pos]++);
  const fillable=['GK','DEF','MID','FWD'].reduce((s,k)=>s+Math.min(unmet[k],avail[k]),0);
  const wants=unmet[p.pos]>0;
  if(!wants&&(fillable>=left||p.pos==='GK'))return 0; // ikinci kaleciye hiçbir koşulda para verme
  const same=remain.filter(r=>r.pos===p.pos),meanPos=same.reduce((s,r)=>s+r.ovr,0)/same.length;
  const f=clamp(1+(p.ovr-meanPos)/6,0.3,2.2);
  const W={GK:0.85,DEF:0.9,MID:1.05,FWD:1.15};
  let demand=0;A.managers.forEach((_,j)=>demand+=needsOf(A,j)[p.pos]);
  const scarce=wants&&avail[p.pos]<=demand?1.15:1;
  let v=(m.budget/left)*W[p.pos]*f*m.aggr*(0.92+A.rng()*0.16)*scarce*(wants?1:0.5);
  v=Math.min(v,left>1?m.budget*0.7:m.budget);
  v=Math.round(v);
  return wants?Math.max(1,v):v;
}
// Gizli yıldızın ihtiyacımız olan mevkiden çıkma ihtimali (kalan 85+ oyuncuların mevki dağılımına göre)
function mysteryFit(A,i){
  const unmet=needsOf(A,i),arr=A.queue.filter(id=>PLAYERS[id].ovr>=MYST_MIN).concat([A.lot.pid]);
  return arr.filter(id=>unmet[PLAYERS[id].pos]>0).length/arr.length;
}
// Kalecisi zaten dolu olan bot, gizli kartın kaleci çıkma riskini (ikinci kaleci) almaz
function mystGKRisk(A,i){
  if(needsOf(A,i).GK>0)return false;
  const arr=A.queue.filter(id=>PLAYERS[id].ovr>=MYST_MIN).concat([A.lot.pid]);
  return arr.filter(id=>PLAYERS[id].pos==='GK').length/arr.length>0.08;
}
// 1 TL'lik yıldız kartı: ihtiyaç duyduğu mevkiden gelme ihtimali yüksekse alır
function botWantsMystery(A,i){return A.managers[i].squad.length<A.cfg.squad&&!mystGKRisk(A,i)&&mysteryFit(A,i)>=0.8;}
// Gizli yıldız için körlemesine değer: yıldız seviyesi × ihtiyaç olasılığı
function botValueMystery(A,i){
  const m=A.managers[i],left=A.cfg.squad-m.squad.length;if(left<=0)return 0;
  if(mystGKRisk(A,i))return 0;
  const p=mysteryFit(A,i);if(p<0.65)return 0;
  const pool=A.queue.map(id=>PLAYERS[id].ovr),mean=pool.length?pool.reduce((a,b)=>a+b,0)/pool.length:80;
  const f=clamp(1+(MYST_MIN+2-mean)/6,1,2.2);
  let v=(m.budget/left)*f*p*m.aggr*(0.9+A.rng()*0.2)*0.9;
  v=Math.min(v,left>1?m.budget*0.6:m.budget);
  return Math.max(1,Math.round(v));
}
// Dönen değer: verilecek teklif (lot.bid'den büyük) ya da 0 = pas
function botDecide(A,i){
  const lot=A.lot;if(!lot.vals)lot.vals={};
  if(lot.vals[i]===undefined)lot.vals[i]=lot.mystery?botValueMystery(A,i):botValue(A,i,PLAYERS[lot.pid]);
  const cap=Math.min(lot.vals[i],maxBid(A,i));
  if(cap<=lot.bid)return 0;
  const gap=cap-lot.bid;let inc=1;
  if(gap>3)inc=1+Math.floor(A.rng()*Math.min(3,gap/2));
  return Math.min(cap,lot.bid+inc);
}

const PW=105,PH=68,MATCH_SECONDS=75;
const TEAM_HEX=['#2563eb','#dc2626','#9333ea','#ea580c','#0d9488','#db2777','#65a30d','#0891b2','#4f46e5','#b45309','#64748b','#be185d','#047857','#7c3aed','#c2410c','#1d4ed8'];
function layoutTeam(ents,team){
  const g={GK:[],DEF:[],MID:[],FWD:[]};ents.forEach(e=>g[e.role].push(e));
  const nonGk=['DEF','MID','FWD'].filter(k=>g[k].length),out=[];let no=1;
  const place=(k,x)=>{const arr=g[k].slice().sort((a,b)=>b.eff-a.eff);
    arr.forEach((e,i)=>{const y=PH*(i+1)/(arr.length+1),st=arr.length>=5&&i%2?4:0,bx=team?PW-(x+st):x+st;
      out.push({p:e.p,team,no:no++,pos:k,nat:e.p.pos,bx,by:y,x:bx,y,ov:null});});};
  if(g.GK.length)place('GK',6);

class MatchSim{

    this.rng=rng;this.res=res;this.teams=[layoutTeam(homePs,0),layoutTeam(awayPs,1)];

    this.log=[];this.timers=[];this.banner=null;this.done=false;this.halfDone=false;this.skipFlag=false;
    this.ball={x:PW/2,y:PH/2,fx:0,fy:0,tx:0,ty:0,t:1,dur:1,flying:false,target:null,cb:null};
    this.holder=null;this.passTimer=0.5;this.poss=0;this.cur=null;this.t=0;

  all(){return this.teams[0].concat(this.teams[1]);}

    const T=this.teams[ti],gk=this.keeperOf(ti);
    const c=T.filter(s=>s!==gk).sort((a,b)=>Math.abs(a.bx-PW/2)-Math.abs(b.bx-PW/2))[0]||T[0];

  }
  after(d,fn){this.timers.push({t:d,fn});}
  kick(target,dur,cb){

    b.tx=target.x;b.ty=target.y;b.dur=Math.max(0.15,dur);b.t=0;b.flying=true;b.cb=cb||null;this.holder=null;

    else if(this.mode==='celebrate'){this.modeT-=dt;if(this.modeT<=0)this.kickoff(1-this.cur.ti);}

  checkTriggers(){

  }
  shoot(H){

  }

    <p>🎁 <b>Sürpriz kart</b> (açık artırma modunda): arada bir, gizli bir <b>yıldız (85 ve üzeri puanlı futbolcu)</b> gelir. O lotta sırası gelen oyuncu, kim çıkacağını bilmeden <b>1 TL</b>'ye kartı alabilir. İstemezse futbolcu gizli kalarak açık artırmaya çıkar, diğer oyuncular körlemesine teklif verir (istemeyen o lotta turdan çıkar). Futbolcunun kim olduğu satıldıktan sonra açıklanır. Mevkisi ihtiyacına uymayabilir, risk sende!</p>
    <p>Her oyuncu yerine 🤖 Bot seçebilirsin. Botlar dengeli bir kadro hedefler (1 kaleci + defans/orta saha/forvet); yalnızca kadrosunda boş kalan mevkideki futbolculara, bütçesine ve futbolcunun puanına göre teklif verir. Mevkisi dolmuş oyuncuya (ör. ikinci kaleci) pas geçer. Sürpriz kartı da mevki ihtiyacına uyma olasılığı yüksekse alırlar. Tüm yerleri bot yaparsan oyunu izleyebilirsin.</p>
    <p>Kadrolar dolunca lig başlar. Takım gücü; hücum (FV/OS) ve savunma (DEF/KL) ortalamalarından hesaplanır, maçlar buna göre şansa da yer bırakarak simüle edilir. Dengeli kadro kur! Kadroda eksik mevki varsa (ör. forvet yok) oyuncular otomatik kaydırılır; ama doğal mevkisi dışında oynayanların performansı düşer. Sezon sonunda <b>gol krallığı</b> ve <b>asist krallığı</b> belli olur.</p>
    <p class="note">Havuzda yaklaşık 400 güncel futbolcu var (Süper Lig takımları dahil). Puanlar yaklaşık değerlerdir, kadrolar 2026-27 sezonu başı baz alınmıştır ve uygulamanın içine gömülüdür (internet gerekmez).</p>
  </details>`;
}

function scheduleBot(){
  clearTimeout(botTimer);
  if(screen!=='auction'||!A||!A.lot)return;
  const t=A.lot.turn;if(!A.managers[t].bot)return;
  const ref=A,allBots=A.managers.every(m=>m.bot);
  botTimer=setTimeout(()=>{
    if(A!==ref||screen!=='auction'||!A.lot||A.lot.turn!==t)return;
    const lot=A.lot;
    if(lot.mystery&&lot.offer){if(botWantsMystery(A,t)&&takeMystery(A)){}else declineMystery(A);afterAuction();return;}
    const d=botDecide(A,t);
    if(d>lot.bid&&placeBid(A,d)){}else passTurn(A);
    afterAuction();
  },allBots?250:800);
}

const M=3;
function drawMatch(cv,sim){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth||600,h=w*PH/(PW+2*M);
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  cv.style.height=h+'px';
  const ctx=cv.getContext('2d'),sc=cv.width/(PW+2*M);
  ctx.setTransform(sc,0,0,sc,M*sc,0);
  ctx.fillStyle='#2e7d32';ctx.fillRect(-M,0,PW+2*M,PH);
  for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#2f8433':'#2a7a2e';ctx.fillRect(i*PW/10,0,PW/10,PH);}
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=0.35;
  ctx.strokeRect(0,0,PW,PH);
  ctx.beginPath();ctx.moveTo(PW/2,0);ctx.lineTo(PW/2,PH);ctx.stroke();
  ctx.beginPath();ctx.arc(PW/2,PH/2,9.15,0,Math.PI*2);ctx.stroke();
  ctx.strokeRect(0,PH/2-20.15,16.5,40.3);ctx.strokeRect(PW-16.5,PH/2-20.15,16.5,40.3);
  ctx.strokeRect(0,PH/2-9.16,5.5,18.32);ctx.strokeRect(PW-5.5,PH/2-9.16,5.5,18.32);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(-2,PH/2-3.66,2,7.32);ctx.fillRect(PW,PH/2-3.66,2,7.32);
  ctx.strokeRect(-2,PH/2-3.66,2,7.32);ctx.strokeRect(PW,PH/2-3.66,2,7.32);
  const cur=sim.cur&&(sim.mode==='goalseq'||sim.mode==='celebrate')?sim.cur.scorer:null;
  const all=sim.all().slice().sort((p,q)=>p.y-q.y);
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const p of all){
    const col=p.pos==='GK'?'#facc15':TEAM_HEX[sim.teamIdx[p.team]];
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(p.x+0.4,p.y+1.5,1.7,0.8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,1.9,0,Math.PI*2);ctx.fill();
    ctx.lineWidth=p===sim.holder||p===cur?0.55:0.3;ctx.strokeStyle=p===sim.holder||p===cur?'#fde047':'#fff';ctx.stroke();
    ctx.fillStyle=p.pos==='GK'?'#1c1917':'#fff';ctx.font='bold 2.2px system-ui,sans-serif';ctx.fillText(p.no,p.x,p.y+0.1);
  }
  const lab=sim.holder||cur;
  if(lab){
    const n=lab.p.name,tw=n.length*1.15+2;
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(lab.x-tw/2,lab.y-6,tw,3);
    ctx.fillStyle='#fff';ctx.font='bold 2px system-ui,sans-serif';ctx.fillText(n,lab.x,lab.y-4.45);
  }
  const bl=sim.ball;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(bl.x+0.3,bl.y+0.9,0.9,0.4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.strokeStyle='#111';ctx.lineWidth=0.25;ctx.beginPath();ctx.arc(bl.x,bl.y,0.85,0,Math.PI*2);ctx.fill();ctx.stroke();
  if(sim.banner){
    const bn=sim.banner;
    ctx.fillStyle=bn.ti!==undefined?TEAM_HEX[sim.teamIdx[bn.ti]]:'rgba(0,0,0,.7)';ctx.globalAlpha=0.88;
    ctx.fillRect(-M,PH/2-10,PW+2*M,20);ctx.globalAlpha=1;
    ctx.fillStyle='#fff';ctx.font='bold 8px system-ui,sans-serif';ctx.fillText(bn.text,PW/2,PH/2-(bn.sub2?4.5:bn.sub?2.5:0));
    if(bn.sub){ctx.font='bold 3.6px system-ui,sans-serif';ctx.fillText(bn.sub,PW/2,PH/2+(bn.sub2?1.8:5));}
    if(bn.sub2){ctx.font='bold 3px system-ui,sans-serif';ctx.fillText(bn.sub2,PW/2,PH/2+6.2);}
  }
}

function playMatch2D(h,a,res,k,total){
  return new Promise(resolve=>{
    if(L.skip)return resolve();

        <button onclick="L.sim.skipFlag=true">Maçı atla ⏭</button><button onclick="L.skip=true">Haftayı atla ⏩</button></div>
      <details style="margin-top:8px"><summary>Kadrolar</summary><div class="lineup">${lineupHTML(sim,[h,a])}</div></details></div>`;
    const cv=$('pitch');let last=performance.now(),lastLog=-1;
    function frame(now){
      const dt=Math.min(0.05,(now-last)/1000);last=now;
      if(L.skip||sim.skipFlag)sim.skipToEnd();else sim.update(dt);
      const hs=$('hs');if(!hs){resolve();return;}
      hs.textContent=sim.score[0]+' – '+sim.score[1];
      $('clk').textContent=Math.min(90,Math.floor(sim.clock))+"'";
      if(sim.log.length!==lastLog){lastLog=sim.log.length;
        $('evlog').innerHTML=sim.log.map(e=>`${e.min}' ⚽ <b>${esc(e.name)}</b>${e.kind==='pen'?' <span class="muted">(pen.)</span>':e.kind==='long'?' <span class="muted">(uzaktan)</span>':''}${e.assist?` <span class="muted">(asist ${esc(e.assist)})</span>`:''} <span style="color:${COL[sim.teamIdx[e.ti]]}">●</span>`).join(' &nbsp; ');}
      drawMatch(cv,sim);
      if(sim.done)resolve();else requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}
async function playWeek(){
  if(L.busy||L.week>=L.rounds.length)return;
  L.busy=true;L.skip=false;render();
  const round=L.rounds[L.week];
  for(let k=0;k<round.length;k++){
    const [h,a]=round[k],res=simulateMatch(lineupOf(h).slots,lineupOf(a).slots);
    await playMatch2D(h,a,res,k,round.length);
    record(h,a,res);
  }
  L.week++;L.busy=false;L.sim=null;render();
}
function simAll(){
  if(L.busy)return;
  while(L.week<L.rounds.length){for(const [h,a] of L.rounds[L.week])record(h,a,simulateMatch(lineupOf(h).slots,lineupOf(a).slots));L.week++;}
  render();
}
function leagueHTML(){
  const nm=i=>esc(A.managers[i].name),sorted=sortTable(L.table),finished=L.week>=L.rounds.length;
  let champ='';
  if(finished){
    const w=sorted[0];
    champ=`<div class="card champ"><div class="muted">🏆 ŞAMPİYON</div><div class="big" style="color:${COL[w.i]}">${nm(w.i)}</div>
      <div class="muted">${w.pts} puan · ${w.w}G ${w.d}B ${w.l}M · averaj ${w.gf-w.ga>0?'+':''}${w.gf-w.ga}</div></div>`;
  }
  const rows=sorted.map((r,k)=>`<tr class="${k===0&&finished?'first':''}"><td>${k+1}</td><td><span style="color:${COL[r.i]}">●</span> ${nm(r.i)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.gf-r.ga}</td><td><b>${r.pts}</b></td></tr>`).join('');
  const topN=A.managers.length>8?10:5;
  const scorers=Object.values(L.scorers).sort((a,b)=>b.goals-a.goals||a.p.id-b.p.id).slice(0,topN);
  const assisters=Object.values(L.assisters).sort((a,b)=>b.assists-a.assists||a.p.id-b.p.id).slice(0,topN);
  const weeks=L.rounds.map((rd,w)=>{
    const done=L.results[w];
    const body=rd.map(([h,a],k)=>{const r=done&&done[k];
      return `<div class="match"><span>${nm(h)}</span><b>${r?r.hg+' – '+r.ag:'vs'}</b><span style="text-align:right">${nm(a)}</span></div>`+
        (r&&r.events.length?`<div class="note" style="padding:2px 0 6px">${r.events.map(e=>`${e.min}' ${esc(e.player.name)}${e.kind==='pen'?' <span class="muted">(pen.)</span>':e.kind==='long'?' <span class="muted">(uzak)</span>':''}${e.assist?' <span class="muted">(asist '+esc(e.assist.name)+')</span>':''}`).join(' · ')}</div>`:'');}).join('');
    const open=(w===L.week&&!finished)||(w===L.week-1)||(finished&&w===L.rounds.length-1);
    return `<details ${open?'open':''} style="margin-bottom:6px;${done?'':'opacity:.75'}"><summary>Hafta ${w+1}${done?' ✓':''}</summary>${body}</details>`;}).join('');
  return `<h1>🏟️ Lig</h1><p class="sub">${finished?'Sezon tamamlandı':'Hafta '+(L.week+1)+' / '+L.rounds.length}</p>${champ}
  <div id="live" class="live"></div>
  <div class="row" style="margin-bottom:14px">
    <button class="primary" ${L.busy||finished?'disabled':''} onclick="playWeek()">▶ Haftayı oynat</button>
    <button ${L.busy||finished?'disabled':''} onclick="simAll()">⏩ Tüm sezonu simüle et</button>
    <button ${L.busy?'disabled':''} onclick="newGame()">Yeni oyun</button></div>
  <div class="card scroll"><h2>Puan durumu</h2><table><tr><th>#</th><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>A</th><th>Y</th><th>Av</th><th>P</th></tr>${rows}</table></div>
  ${scorers.length?`<div class="card"><h2>⚽ Gol krallığı</h2>${scorers.map((s,k)=>`<div class="match"><span>${k+1}. ${esc(s.p.name)} <span class="muted">(${nm(s.team)})</span></span><b>${s.goals}</b></div>`).join('')}</div>`:''}
  ${assisters.length?`<div class="card"><h2>🎯 Asist krallığı</h2>${assisters.map((s,k)=>`<div class="match"><span>${k+1}. ${esc(s.p.name)} <span class="muted">(${nm(s.team)})</span></span><b>${s.assists}</b></div>`).join('')}</div>`:''}
  <div class="card"><h2>Fikstür</h2>${weeks}</div>`;
}
function newGame(){if(confirm('Yeni oyun başlasın mı?')){clearTimeout(botTimer);screen='setup';A=null;L=null;render();}}
render();
</script>
</body>
</html>
