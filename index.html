<div id="app"></div>
<script>
// ==LOGIC==
const RAW=`Thibaut Courtois|GK|BEL|89
Alisson Becker|GK|BRA|88

Rodri|MID|ESP|91
Jude Bellingham|MID|ENG|90

Pedri|MID|ESP|88

Florian Wirtz|MID|GER|88
Federico Valverde|MID|URU|87
Bernardo Silva|MID|POR|87
Bruno Fernandes|MID|POR|87
Declan Rice|MID|ENG|87
Phil Foden|MID|ENG|87
Vitinha|MID|POR|86
Nicolò Barella|MID|ITA|86
Cole Palmer|MID|ENG|86
Joshua Kimmich|MID|GER|86
Hakan Çalhanoğlu|MID|TUR|85
Frenkie de Jong|MID|NED|85
Alexis Mac Allister|MID|ARG|85
Luka Modrić|MID|CRO|83
Enzo Fernández|MID|ARG|83
Gavi|MID|ESP|83
Arda Güler|MID|TUR|82
Orkun Kökçü|MID|TUR|79
Kylian Mbappé|FWD|FRA|92
Erling Haaland|FWD|NOR|92
Lamine Yamal|FWD|ESP|90
Vinícius Júnior|FWD|BRA|90
Harry Kane|FWD|ENG|90
Mohamed Salah|FWD|EGY|89
Ousmane Dembélé|FWD|FRA|89
Raphinha|FWD|BRA|88
Bukayo Saka|FWD|ENG|88
Lautaro Martínez|FWD|ARG|87
Victor Osimhen|FWD|NGA|87
Robert Lewandowski|FWD|POL|86
Rafael Leão|FWD|POR|86
Khvicha Kvaratskhelia|FWD|GEO|86
Viktor Gyökeres|FWD|SWE|86
Alexander Isak|FWD|SWE|86
Lionel Messi|FWD|ARG|86
Antoine Griezmann|FWD|FRA|85
Julián Álvarez|FWD|ARG|85
Michael Olise|FWD|FRA|85
Heung-min Son|FWD|KOR|84
Serhou Guirassy|FWD|GUI|83
Cristiano Ronaldo|FWD|POR|82
Marcus Rashford|FWD|ENG|82
Darwin Núñez|FWD|URU|81
Kenan Yıldız|FWD|TUR|80
Mauro Icardi|FWD|ARG|80
Barış Alper Yılmaz|FWD|TUR|78`;
const PLAYERS=RAW.trim().split('\n').map((l,i)=>{const [name,pos,ctry,ovr]=l.split('|');return {id:i,name,pos,ctry,ovr:+ovr};});
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function shuffle(a,rng=Math.random){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// Mevki uyumu: FIT[doğalMevki][oynadığıMevki] -> performans çarpanı
const FIT={
  GK:{GK:1,DEF:.5,MID:.45,FWD:.3},
  DEF:{GK:.5,DEF:1,MID:.88,FWD:.75},
  MID:{GK:.4,DEF:.88,MID:1,FWD:.9},
  FWD:{GK:.3,DEF:.72,MID:.9,FWD:1}};
const BASE_FORM={3:[1,0,1],4:[1,1,1],5:[2,1,1],6:[2,2,1],7:[2,2,2],8:[3,2,2],9:[3,3,2],10:[3,4,2],11:[4,3,3]};
const ROLE_ORDER={GK:0,DEF:1,MID:2,FWD:3};
const atkRole=(e,r)=>r==='FWD'?e:r==='MID'?e*0.85:r==='DEF'?e*0.35:e*0.1;
const defRole=(e,r)=>r==='FWD'?e*0.4:r==='MID'?e*0.75:r==='DEF'?e:e*1.05;
function formations(n){const o=[];for(let d=1;d<=5;d++)for(let m=(n>=4?1:0);m<=5;m++)for(let f=1;f<=3;f++)if(1+d+m+f===n)o.push([d,m,f]);return o;}
// Oyuncuları slotlara en yüksek toplam etkili puanla yerleştirir (bitmask DP)
function bestAssign(players,slots){
  const n=players.length,size=1<<n,dp=new Float64Array(size).fill(-1e9),from=new Int16Array(size).fill(-1),pc=new Uint8Array(size);
  for(let m=1;m<size;m++)pc[m]=pc[m>>1]+(m&1);
  dp[0]=0;
  for(let mask=0;mask<size;mask++){
    if(dp[mask]<-1e8)continue;const i=pc[mask];if(i>=n)continue;
    for(let sl=0;sl<n;sl++){if(mask&(1<<sl))continue;
      const v=dp[mask]+players[i].ovr*FIT[players[i].pos][slots[sl]],nm=mask|(1<<sl);
      if(v>dp[nm]){dp[nm]=v;from[nm]=sl;}}
  }
  const assign=new Array(n);let mask=size-1;
  for(let i=n-1;i>=0;i--){const sl=from[mask];assign[i]=sl;mask^=1<<sl;}
  return {total:dp[size-1],assign};
}
// Kadroya en uygun dizilişi seçer; mevkisi uymayanları gerekli yerlere kaydırır
function buildLineup(players){
  const n=players.length,base=BASE_FORM[n]||BASE_FORM[11];let best=null;
  for(const fm of formations(n)){
    const slots=['GK',...Array(fm[0]).fill('DEF'),...Array(fm[1]).fill('MID'),...Array(fm[2]).fill('FWD')];
    const r=bestAssign(players,slots);
    const score=r.total-1.5*(Math.abs(fm[0]-base[0])+Math.abs(fm[1]-base[1])+Math.abs(fm[2]-base[2]));
    if(!best||score>best.score)best={score,fm,slots,assign:r.assign};
  }
  const ents=players.map((p,i)=>{const role=best.slots[best.assign[i]];return {p,role,eff:p.ovr*FIT[p.pos][role]};});
  ents.sort((x,y)=>ROLE_ORDER[x.role]-ROLE_ORDER[y.role]||y.eff-x.eff);
  return {form:best.fm,label:best.fm.join('-'),slots:ents};
}
function teamStats(ents){
  if(!ents.length)return {atk:1,def:1,ovr:0};
  const n=ents.length;
  return {atk:ents.reduce((s,e)=>s+atkRole(e.eff,e.role),0)/n,def:ents.reduce((s,e)=>s+defRole(e.eff,e.role),0)/n,ovr:ents.reduce((s,e)=>s+e.eff,0)/n};
}
function poisson(l,rng=Math.random){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=rng();}while(p>L);return k-1;}
function lambda(att,def){return clamp(0.78*Math.pow((att.atk/def.def)/0.8,3),0.15,4.5);}
function pickScorer(ents,rng){
  const w=ents.map(e=>Math.pow(atkRole(e.eff,e.role),3)),t=w.reduce((a,b)=>a+b,0);let r=rng()*t;
  for(let i=0;i<ents.length;i++){r-=w[i];if(r<=0)return ents[i].p;}
  return ents[ents.length-1].p;
}
function simulateMatch(homeEnts,awayEnts,rng=Math.random){
  const hs=teamStats(homeEnts),as=teamStats(awayEnts);
  const hg=poisson(lambda(hs,as),rng),ag=poisson(lambda(as,hs),rng);
  const events=[];
  for(let i=0;i<hg;i++)events.push({min:1+Math.floor(rng()*90),side:'h',player:pickScorer(homeEnts,rng)});
  for(let i=0;i<ag;i++)events.push({min:1+Math.floor(rng()*90),side:'a',player:pickScorer(awayEnts,rng)});
  events.sort((a,b)=>a.min-b.min);
  return {hg,ag,events};
}
function buildRounds(n,double){
  const ids=[...Array(n).keys()];if(n%2)ids.push(-1);
  const m=ids.length,rounds=[];let arr=ids.slice();
  for(let r=0;r<m-1;r++){
    const round=[];
    for(let i=0;i<m/2;i++){const a=arr[i],b=arr[m-1-i];if(a>=0&&b>=0)round.push(r%2?[b,a]:[a,b]);}
    rounds.push(round);
    arr=[arr[0],arr[m-1],...arr.slice(1,m-1)];
  }
  if(double)rounds.push(...rounds.map(rd=>rd.map(([a,b])=>[b,a])));
  return rounds;
}
function newTable(n){return [...Array(n).keys()].map(i=>({i,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));}
function applyResult(table,h,a,hg,ag){
  const H=table[h],A=table[a];
  H.p++;A.p++;H.gf+=hg;H.ga+=ag;A.gf+=ag;A.ga+=hg;
  if(hg>ag){H.w++;A.l++;H.pts+=3;}else if(hg<ag){A.w++;H.l++;A.pts+=3;}else{H.d++;A.d++;H.pts++;A.pts++;}
}
function sortTable(t){return t.slice().sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||x.i-y.i);}

// ---- Açık artırma motoru ----
function maxBid(A,i){const m=A.managers[i],left=A.cfg.squad-m.squad.length;return left<=0?0:m.budget-(left-1);}
function newAuction(cfg,rng=Math.random){
  const BOT_NAMES=['Robo Hoca','Kaptan Bot','Mister Metal','Algoritma Hoca'];
  const managers=cfg.names.slice(0,cfg.n).map((nm,i)=>{
    const bot=!!(cfg.bots&&cfg.bots[i]),base=(nm||'').trim()||(bot?BOT_NAMES[i%BOT_NAMES.length]:('Oyuncu '+(i+1)));
    return {name:bot?'🤖 '+base:base,bot,aggr:0.85+rng()*0.35,budget:cfg.budget,squad:[]};});
  // Havuz: her mevkiden herkesin dengeli kadro kurmasına yetecek kadar (+ biraz fazla) futbolcu garanti edilir
  const bf=BASE_FORM[cfg.squad]||BASE_FORM[11],tgt={GK:1,DEF:bf[0],MID:bf[1],FWD:bf[2]},extra=Math.max(1,Math.round(cfg.n/2));
  const chosen=[];
  for(const k of ['GK','DEF','MID','FWD']){const ids=shuffle(PLAYERS.filter(p=>p.pos===k).map(p=>p.id),rng);chosen.push(...ids.slice(0,cfg.n*tgt[k]+extra));}
  const chosenSet=new Set(chosen),rest=shuffle(PLAYERS.map(p=>p.id).filter(id=>!chosenSet.has(id)),rng);
  const poolSize=Math.min(PLAYERS.length,Math.max(chosen.length,cfg.n*cfg.squad+Math.max(6,cfg.n*3)));
  const queue=shuffle(chosen.concat(rest.slice(0,Math.max(0,poolSize-chosen.length))),rng);
  const A={cfg,managers,queue,discarded:[],lot:null,lotNo:0,last:null,done:false,total:poolSize,rng};
  startLot(A);return A;
}
function startLot(A){
  if(A.managers.every(m=>m.squad.length>=A.cfg.squad)){A.done=true;A.lot=null;return;}
  if(!A.queue.length){fillRemaining(A);return;}
  const pid=A.queue.shift();A.lotNo++;
  const n=A.managers.length;
  const active=A.managers.map((m,i)=>i).filter(i=>maxBid(A,i)>=1);
  A.lot={pid,bid:0,leader:-1,active,turn:-1};
  settle(A,(((A.lotNo-2)%n)+n)%n);
}
function settle(A,from){
  const lot=A.lot,n=A.managers.length;
  lot.active=lot.active.filter(i=>i===lot.leader||maxBid(A,i)>lot.bid);
  if(lot.leader>=0&&lot.active.length===1){
    const m=A.managers[lot.leader];m.squad.push(lot.pid);m.budget-=lot.bid;
    A.last={pid:lot.pid,who:lot.leader,price:lot.bid,sold:true};A.lot=null;startLot(A);return;
  }
  if(lot.leader<0&&lot.active.length===0){
    A.discarded.push(lot.pid);A.last={pid:lot.pid,sold:false};A.lot=null;startLot(A);return;
  }
  for(let k=1;k<=n;k++){const i=(from+k)%n;if(lot.active.includes(i)&&i!==lot.leader){lot.turn=i;return;}}
}
function placeBid(A,amount){
  const lot=A.lot;if(!lot)return false;
  if(!Number.isInteger(amount)||amount<=lot.bid||amount>maxBid(A,lot.turn))return false;
  lot.bid=amount;lot.leader=lot.turn;settle(A,lot.turn);return true;
}
function passTurn(A){
  const lot=A.lot;if(!lot)return;
  const t=lot.turn;lot.active=lot.active.filter(i=>i!==t);settle(A,t);
}
function fillRemaining(A){
  const pool=shuffle([...A.queue,...A.discarded],A.rng);A.queue=[];A.filled=[];
  A.managers.forEach((m,i)=>{while(m.squad.length<A.cfg.squad&&pool.length){const pid=pool.pop();m.squad.push(pid);A.filled.push({pid,who:i});}});
  A.done=true;A.lot=null;
}
// ---- Bot mantığı ----
// Bir yöneticinin hâlâ doldurması gereken mevki sayıları (hedef diziliş: 1 KL + BASE_FORM)
function needsOf(A,i){
  const bf=BASE_FORM[A.cfg.squad]||BASE_FORM[11],target={GK:1,DEF:bf[0],MID:bf[1],FWD:bf[2]};
  const have={GK:0,DEF:0,MID:0,FWD:0};A.managers[i].squad.forEach(id=>have[PLAYERS[id].pos]++);
  const u={};for(const k of ['GK','DEF','MID','FWD'])u[k]=Math.max(0,target[k]-have[k]);return u;
}
// Bir botun bu futbolcuya biçtiği değer. Mevkisi kadroda ihtiyaç değilse 0 (pas), ancak
// havuzda ihtiyaçlarını karşılayacak kadar oyuncu kalmadıysa yedek plan olarak düşük değer biçer.
function botValue(A,i,p){
  const m=A.managers[i],left=A.cfg.squad-m.squad.length;if(left<=0)return 0;
  const unmet=needsOf(A,i),remain=[p.id,...A.queue].map(id=>PLAYERS[id]);
  const avail={GK:0,DEF:0,MID:0,FWD:0};remain.forEach(r=>avail[r.pos]++);
  const fillable=['GK','DEF','MID','FWD'].reduce((s,k)=>s+Math.min(unmet[k],avail[k]),0);
  const wants=unmet[p.pos]>0;
  if(!wants&&fillable>=left)return 0;
  const same=remain.filter(r=>r.pos===p.pos),meanPos=same.reduce((s,r)=>s+r.ovr,0)/same.length;
  const f=clamp(1+(p.ovr-meanPos)/6,0.3,2.2);
  const W={GK:0.85,DEF:0.9,MID:1.05,FWD:1.15};
  let demand=0;A.managers.forEach((_,j)=>demand+=needsOf(A,j)[p.pos]);
  const scarce=wants&&avail[p.pos]<=demand?1.15:1;
  let v=(m.budget/left)*W[p.pos]*f*m.aggr*(0.92+A.rng()*0.16)*scarce*(wants?1:0.5);
  v=Math.min(v,left>1?m.budget*0.7:m.budget);
  v=Math.round(v);
  return wants?Math.max(1,v):v;
}
// Dönen değer: verilecek teklif (lot.bid'den büyük) ya da 0 = pas
function botDecide(A,i){
  const lot=A.lot;if(!lot.vals)lot.vals={};
  if(lot.vals[i]===undefined)lot.vals[i]=botValue(A,i,PLAYERS[lot.pid]);
  const cap=Math.min(lot.vals[i],maxBid(A,i));
  if(cap<=lot.bid)return 0;
  const gap=cap-lot.bid;let inc=1;
  if(gap>3)inc=1+Math.floor(A.rng()*Math.min(3,gap/2));
  return Math.min(cap,lot.bid+inc);
}

// ==SIM==
const PW=105,PH=68,MATCH_SECONDS=75;
const TEAM_HEX=['#2563eb','#dc2626','#9333ea','#ea580c'];
function layoutTeam(ents,team){
  const g={GK:[],DEF:[],MID:[],FWD:[]};ents.forEach(e=>g[e.role].push(e));
  const nonGk=['DEF','MID','FWD'].filter(k=>g[k].length),out=[];let no=1;
  const place=(k,x)=>{const arr=g[k].slice().sort((a,b)=>b.eff-a.eff);
    arr.forEach((e,i)=>{const y=PH*(i+1)/(arr.length+1),st=arr.length>=5&&i%2?4:0,bx=team?PW-(x+st):x+st;
      out.push({p:e.p,team,no:no++,pos:k,nat:e.p.pos,bx,by:y,x:bx,y,ov:null});});};
  if(g.GK.length)place('GK',6);
  nonGk.forEach((k,j)=>place(k,nonGk.length===1?46:26+44*j/(nonGk.length-1)));
  return out;
}
class MatchSim{
  constructor(homePs,awayPs,res,rng=Math.random){
    this.rng=rng;this.res=res;this.teams=[layoutTeam(homePs,0),layoutTeam(awayPs,1)];
    this.events=res.events.slice();this.ei=0;this.score=[0,0];this.clock=0;this.speed=1;
    this.log=[];this.timers=[];this.banner=null;this.done=false;this.halfDone=false;this.skipFlag=false;
    this.ball={x:PW/2,y:PH/2,fx:0,fy:0,tx:0,ty:0,t:1,dur:1,flying:false,target:null,cb:null};
    this.holder=null;this.passTimer=0.5;this.poss=0;this.cur=null;this.t=0;
    this.kickoff(0);
  }
  all(){return this.teams[0].concat(this.teams[1]);}
  keeperOf(ti){const T=this.teams[ti],gk=T.find(s=>s.pos==='GK');if(gk)return gk;const gx=ti?PW:0;return T.slice().sort((a,b)=>Math.abs(a.bx-gx)-Math.abs(b.bx-gx))[0];}
  kickoff(ti){
    this.all().forEach(s=>s.ov=null);
    this.mode='kickoff';this.modeT=1.5;this.poss=ti;this.banner=null;
    const T=this.teams[ti],gk=this.keeperOf(ti);
    const c=T.filter(s=>s!==gk).sort((a,b)=>Math.abs(a.bx-PW/2)-Math.abs(b.bx-PW/2))[0]||T[0];
    this.holder=c;c.ov={x:PW/2-(ti?-1:1)*1.5,y:PH/2};
    this.ball.flying=false;this.ball.x=PW/2;this.ball.y=PH/2;this.passTimer=0.4;
  }
  after(d,fn){this.timers.push({t:d,fn});}
  kick(target,dur,cb){
    const b=this.ball;b.fx=b.x;b.fy=b.y;b.target=(target&&target.team!==undefined)?target:null;
    b.tx=target.x;b.ty=target.y;b.dur=Math.max(0.15,dur);b.t=0;b.flying=true;b.cb=cb||null;this.holder=null;
  }
  update(dtR){
    if(this.done)return;
    const dt=dtR*this.speed;this.t+=dt;
    for(const tm of this.timers)tm.t-=dt;
    const due=this.timers.filter(x=>x.t<=0);this.timers=this.timers.filter(x=>x.t>0);due.forEach(x=>x.fn());
    if(this.mode==='kickoff'){this.modeT-=dt;if(this.modeT<=0){this.all().forEach(s=>s.ov=null);this.mode='play';}}
    else if(this.mode==='play'){this.clock+=dt*90/MATCH_SECONDS;this.ambient(dt);this.checkTriggers();}
    else if(this.mode==='celebrate'){this.modeT-=dt;if(this.modeT<=0)this.kickoff(1-this.cur.ti);}
    else if(this.mode==='break'){this.modeT-=dt;if(this.modeT<=0)this.kickoff(1);}
    else if(this.mode==='full'){this.modeT-=dt;if(this.modeT<=0)this.done=true;}
    this.moveBall(dt);this.movePlayers(dt);
  }
  checkTriggers(){
    const e=this.events[this.ei];
    if(e&&this.clock>=Math.max(e.min-1,1)){this.startGoal(e);return;}
    if(!this.halfDone&&this.clock>=45){this.halfDone=true;this.mode='break';this.modeT=1.8;this.banner={text:'Devre arası'};return;}
    if(!e&&this.clock>=90){this.mode='full';this.modeT=1.8;this.banner={text:'Maç sona erdi'};}
  }
  ambient(dt){
    if(this.ball.flying)return;
    if(!this.holder){this.holder=this.teams[this.poss][0];}
    this.passTimer-=dt;if(this.passTimer>0)return;
    this.passTimer=0.2+this.rng()*0.35;
    const H=this.holder,ti=H.team,dir=ti?-1:1,prog=dir>0?H.x/PW:(PW-H.x)/PW,r=this.rng();
    if(prog>0.68&&r<0.2){this.shoot(H);return;}
    if(r<0.09){
      const opp=this.teams[1-ti].slice().sort((a,b)=>Math.hypot(a.x-H.x,a.y-H.y)-Math.hypot(b.x-H.x,b.y-H.y));
      const o=opp[Math.floor(this.rng()*Math.min(2,opp.length))];
      this.kick(o,0.6,()=>{this.holder=o;this.poss=o.team;this.passTimer=0.25;});return;
    }
    const cands=this.teams[ti].filter(s=>s!==H);
    const w=cands.map(s=>{const d=Math.hypot(s.x-H.x,s.y-H.y);return Math.exp(-d/22)*(1+Math.max(0,(s.x-H.x)*dir)/25);});
    let tot=w.reduce((a,b)=>a+b,0),x=this.rng()*tot,pick=cands[cands.length-1];
    for(let i=0;i<cands.length;i++){x-=w[i];if(x<=0){pick=cands[i];break;}}
    const d=Math.hypot(pick.x-H.x,pick.y-H.y);
    this.kick(pick,clamp(d/30,0.45,1.3),()=>{this.holder=pick;this.passTimer=0.2+this.rng()*0.3;});
  }
  shoot(H){
    const ti=H.team,dir=ti?-1:1,gx=dir>0?PW:0,gk=this.keeperOf(1-ti);
    if(this.rng()<0.55){
      const gy=PH/2+(this.rng()-0.5)*9;gk.ov={x:gk.bx,y:clamp(gy,25,43)};
      this.kick({x:gx,y:gy},0.5,()=>{this.kick(gk,0.35,()=>{this.holder=gk;this.poss=1-ti;gk.ov=null;this.passTimer=0.8;});});
    }else{
      const gy=PH/2+(this.rng()<0.5?-1:1)*(6+this.rng()*6);
      this.kick({x:gx+dir*4,y:gy},0.55,()=>{this.after(0.3,()=>{this.kick(gk,0.9,()=>{this.holder=gk;this.poss=1-ti;this.passTimer=0.8;});});});
    }
  }
  startGoal(e){
    const ti=e.side==='h'?0:1,T=this.teams[ti],dir=ti?-1:1,gx=dir>0?PW:0;
    const scorer=T.find(s=>s.p.id===e.player.id)||T[0];
    const pool=T.filter(s=>s!==scorer&&s.pos!=='GK'),assist=(pool.length?pool:T.filter(s=>s!==scorer))[Math.floor(this.rng()*Math.max(1,pool.length))]||scorer;
    this.ei++;this.mode='goalseq';this.poss=ti;this.cur={e,ti,scorer};this.holder=null;this.timers=[];
    const sy=PH/2+(this.rng()-0.5)*14;
    scorer.ov={x:gx-dir*15,y:sy};assist.ov={x:gx-dir*26,y:PH/2+(this.rng()-0.5)*30};
    const gk=this.keeperOf(1-ti),gy=PH/2+(this.rng()-0.5)*5;
    this.kick(assist,0.8,()=>{this.holder=assist;this.after(0.35,()=>{
      this.kick(scorer,0.7,()=>{this.holder=scorer;this.after(0.45,()=>{
        gk.ov={x:gk.bx,y:clamp(PH/2+(gy-PH/2)*-0.6,26,42)};
        this.kick({x:gx,y:gy},0.5,()=>this.goalScored());
      });});});});
  }
  goalScored(){
    const {e,ti,scorer}=this.cur,dir=ti?-1:1,gx=dir>0?PW:0;
    this.score[ti]++;this.clock=Math.max(this.clock,e.min);this.log.push({min:e.min,ti,name:e.player.name});
    this.mode='celebrate';this.modeT=2.8;this.banner={text:'GOL!',sub:e.player.name+" "+e.min+"'",ti};
    this.holder=null;this.ball.flying=false;this.ball.x=gx;this.ball.y=this.ball.ty;
    const cx=gx-dir*4,cy=scorer.y>PH/2?PH-5:5;scorer.ov={x:cx,y:cy};
    this.teams[ti].forEach(s=>{if(s!==scorer&&s.pos!=='GK')s.ov={x:cx-dir*(2+this.rng()*7),y:cy+(cy>PH/2?-1:1)*(1+this.rng()*8)};});
  }
  skipToEnd(){
    while(this.ei<this.events.length){const e=this.events[this.ei++],ti=e.side==='h'?0:1;this.score[ti]++;this.log.push({min:e.min,ti,name:e.player.name});}
    this.clock=90;this.mode='full';this.done=true;
  }
  moveBall(dt){
    const b=this.ball;
    if(b.flying){
      if(b.target){b.tx=b.target.x;b.ty=b.target.y;}
      b.t+=dt/b.dur;const p=Math.min(1,b.t),e=p*(2-p);
      b.x=b.fx+(b.tx-b.fx)*e;b.y=b.fy+(b.ty-b.fy)*e;
      if(p>=1){b.flying=false;const cb=b.cb;b.cb=null;if(cb)cb();}
    }else if(this.holder){const d=this.holder.team?-1:1;b.x=this.holder.x+d*1.3;b.y=this.holder.y+0.3;}
  }
  movePlayers(dt){
    const b=this.ball,k=Math.min(1,dt*2.6);
    for(const ti of [0,1]){
      const dir=ti?-1:1,has=this.poss===ti;
      for(const s of this.teams[ti]){
        let tx,ty;
        if(s.ov){tx=s.ov.x;ty=s.ov.y;}
        else if(s.pos==='GK'){tx=s.bx;ty=clamp(s.by+(b.y-PH/2)*0.2,22,46);}
        else{
          const push=has?7:-4,wob=Math.sin(this.t*0.9+s.no*1.7)*1.4,wob2=Math.cos(this.t*0.7+s.no*2.3)*1.4;
          tx=s.bx+dir*push+(b.x-s.bx)*0.14+wob;ty=s.by+(b.y-s.by)*0.18+wob2;
          if(s===this.holder)tx+=dir*3;
        }
        s.x+=(tx-s.x)*k;s.y+=(ty-s.y)*k;
        s.x=clamp(s.x,1,PW-1);s.y=clamp(s.y,1,PH-1);
      }
    }
  }
}

const sleep=ms=>L.skip?Promise.resolve():new Promise(r=>setTimeout(r,ms));
function record(h,a,res){
  applyResult(L.table,h,a,res.hg,res.ag);
  (L.results[L.week]=L.results[L.week]||[]).push({h,a,hg:res.hg,ag:res.ag,events:res.events});
  res.events.forEach(e=>{const s=L.scorers[e.player.id]=L.scorers[e.player.id]||{p:e.player,team:e.side==='h'?h:a,goals:0};s.goals++;});
}
const M=3;
function drawMatch(cv,sim){
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth||600,h=w*PH/(PW+2*M);
  if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  cv.style.height=h+'px';
  const ctx=cv.getContext('2d'),sc=cv.width/(PW+2*M);
  ctx.setTransform(sc,0,0,sc,M*sc,0);
  ctx.fillStyle='#2e7d32';ctx.fillRect(-M,0,PW+2*M,PH);
  for(let i=0;i<10;i++){ctx.fillStyle=i%2?'#2f8433':'#2a7a2e';ctx.fillRect(i*PW/10,0,PW/10,PH);}
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=0.35;
  ctx.strokeRect(0,0,PW,PH);
  ctx.beginPath();ctx.moveTo(PW/2,0);ctx.lineTo(PW/2,PH);ctx.stroke();
  ctx.beginPath();ctx.arc(PW/2,PH/2,9.15,0,Math.PI*2);ctx.stroke();
  ctx.strokeRect(0,PH/2-20.15,16.5,40.3);ctx.strokeRect(PW-16.5,PH/2-20.15,16.5,40.3);
  ctx.strokeRect(0,PH/2-9.16,5.5,18.32);ctx.strokeRect(PW-5.5,PH/2-9.16,5.5,18.32);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(-2,PH/2-3.66,2,7.32);ctx.fillRect(PW,PH/2-3.66,2,7.32);
  ctx.strokeRect(-2,PH/2-3.66,2,7.32);ctx.strokeRect(PW,PH/2-3.66,2,7.32);
  const cur=sim.cur&&(sim.mode==='goalseq'||sim.mode==='celebrate')?sim.cur.scorer:null;
  const all=sim.all().slice().sort((p,q)=>p.y-q.y);
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const p of all){
    const col=p.pos==='GK'?'#facc15':TEAM_HEX[sim.teamIdx[p.team]];
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(p.x+0.4,p.y+1.5,1.7,0.8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,1.9,0,Math.PI*2);ctx.fill();
    ctx.lineWidth=p===sim.holder||p===cur?0.55:0.3;ctx.strokeStyle=p===sim.holder||p===cur?'#fde047':'#fff';ctx.stroke();
    ctx.fillStyle=p.pos==='GK'?'#1c1917':'#fff';ctx.font='bold 2.2px system-ui,sans-serif';ctx.fillText(p.no,p.x,p.y+0.1);
  }
  const lab=sim.holder||cur;
  if(lab){
    const n=lab.p.name,tw=n.length*1.15+2;
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(lab.x-tw/2,lab.y-6,tw,3);
    ctx.fillStyle='#fff';ctx.font='bold 2px system-ui,sans-serif';ctx.fillText(n,lab.x,lab.y-4.45);
  }
  const bl=sim.ball;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(bl.x+0.3,bl.y+0.9,0.9,0.4,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.strokeStyle='#111';ctx.lineWidth=0.25;ctx.beginPath();ctx.arc(bl.x,bl.y,0.85,0,Math.PI*2);ctx.fill();ctx.stroke();
  if(sim.banner){
    const bn=sim.banner;
    ctx.fillStyle=bn.ti!==undefined?TEAM_HEX[sim.teamIdx[bn.ti]]:'rgba(0,0,0,.7)';ctx.globalAlpha=0.88;
    ctx.fillRect(-M,PH/2-9,PW+2*M,18);ctx.globalAlpha=1;
    ctx.fillStyle='#fff';ctx.font='bold 8px system-ui,sans-serif';ctx.fillText(bn.text,PW/2,PH/2-(bn.sub?2.5:0));
    if(bn.sub){ctx.font='bold 3.6px system-ui,sans-serif';ctx.fillText(bn.sub,PW/2,PH/2+5);}
  }
}
function lineupHTML(sim,idx){
  return sim.teams.map((T,t)=>`<div><b style="color:${COL[idx[t]]}">${esc(A.managers[idx[t]].name)}</b> <span class="muted">${lineupOf(idx[t]).label}</span>`+
    T.map(x=>`<div class="l"><span class="num" style="background:${x.pos==='GK'?'#ca8a04':TEAM_HEX[idx[t]]}">${x.no}</span>${esc(x.p.name)} ${rolePill(x.pos)}${x.nat!==x.pos?` <span title="Doğal mevkisi ${POS_TR[x.nat]}" style="color:var(--warn)">⚠</span>`:''}</div>`).join('')+'</div>').join('');
}
function setSpeed(v){if(L.sim)L.sim.speed=v;document.querySelectorAll('.spd button[data-s]').forEach(b=>b.classList.toggle('on',+b.dataset.s===v));}
function playMatch2D(h,a,res,k,total){
  return new Promise(resolve=>{
    if(L.skip)return resolve();
    const sim=new MatchSim(lineupOf(h).slots,lineupOf(a).slots,res);sim.teamIdx=[h,a];L.sim=sim;
    const nm=i=>esc(A.managers[i].name);
    $('live').innerHTML=`<div class="card live"><div class="muted" style="text-align:center">Hafta ${L.week+1} · ${k+1}/${total}. maç</div>
      <div class="hud"><span style="color:${COL[h]}">${nm(h)}</span><span class="sc" id="hs">0 – 0</span><span style="color:${COL[a]}">${nm(a)}</span></div>
      <div class="muted" style="text-align:center" id="clk">0'</div>
      <canvas id="pitch"></canvas><div id="evlog" class="note"></div>
      <div class="row spd" style="margin-top:8px;justify-content:center">
        <button data-s="1" class="on" onclick="setSpeed(1)">1×</button><button data-s="2" onclick="setSpeed(2)">2×</button><button data-s="4" onclick="setSpeed(4)">4×</button>
        <button onclick="L.sim.skipFlag=true">Maçı atla ⏭</button><button onclick="L.skip=true">Haftayı atla ⏩</button></div>
      <details style="margin-top:8px"><summary>Kadrolar</summary><div class="lineup">${lineupHTML(sim,[h,a])}</div></details></div>`;
    const cv=$('pitch');let last=performance.now(),lastLog=-1;
    function frame(now){
      const dt=Math.min(0.05,(now-last)/1000);last=now;
      if(L.skip||sim.skipFlag)sim.skipToEnd();else sim.update(dt);
      const hs=$('hs');if(!hs){resolve();return;}
      hs.textContent=sim.score[0]+' – '+sim.score[1];
      $('clk').textContent=Math.min(90,Math.floor(sim.clock))+"'";
      if(sim.log.length!==lastLog){lastLog=sim.log.length;
        $('evlog').innerHTML=sim.log.map(e=>`${e.min}' ⚽ <b>${esc(e.name)}</b> <span style="color:${COL[sim.teamIdx[e.ti]]}">●</span>`).join(' &nbsp; ');}
      drawMatch(cv,sim);
      if(sim.done)resolve();else requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}
async function playWeek(){
  if(L.busy||L.week>=L.rounds.length)return;
  L.busy=true;L.skip=false;render();
  const round=L.rounds[L.week];
  for(let k=0;k<round.length;k++){
    const [h,a]=round[k],res=simulateMatch(lineupOf(h).slots,lineupOf(a).slots);
    await playMatch2D(h,a,res,k,round.length);
    record(h,a,res);
  }
  L.week++;L.busy=false;L.sim=null;render();
}
function simAll(){
  if(L.busy)return;
  while(L.week<L.rounds.length){for(const [h,a] of L.rounds[L.week])record(h,a,simulateMatch(lineupOf(h).slots,lineupOf(a).slots));L.week++;}
  render();
}
function leagueHTML(){
  const nm=i=>esc(A.managers[i].name),sorted=sortTable(L.table),finished=L.week>=L.rounds.length;
  let champ='';
  if(finished){
    const w=sorted[0];
    champ=`<div class="card champ"><div class="muted">🏆 ŞAMPİYON</div><div class="big" style="color:${COL[w.i]}">${nm(w.i)}</div>
      <div class="muted">${w.pts} puan · ${w.w}G ${w.d}B ${w.l}M · averaj ${w.gf-w.ga>0?'+':''}${w.gf-w.ga}</div></div>`;
  }
  const rows=sorted.map((r,k)=>`<tr class="${k===0&&finished?'first':''}"><td>${k+1}</td><td><span style="color:${COL[r.i]}">●</span> ${nm(r.i)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.gf-r.ga}</td><td><b>${r.pts}</b></td></tr>`).join('');
  const scorers=Object.values(L.scorers).sort((a,b)=>b.goals-a.goals).slice(0,5);
  const weeks=L.rounds.map((rd,w)=>{
    const done=L.results[w];
    const body=rd.map(([h,a],k)=>{const r=done&&done[k];
      return `<div class="match"><span>${nm(h)}</span><b>${r?r.hg+' – '+r.ag:'vs'}</b><span style="text-align:right">${nm(a)}</span></div>`+
        (r&&r.events.length?`<div class="note" style="padding:2px 0 6px">${r.events.map(e=>`${e.min}' ${esc(e.player.name)}`).join(' · ')}</div>`:'');}).join('');
    return `<div style="margin-bottom:10px;${w===L.week&&!finished?'':'opacity:'+(done?1:.7)}"><b>Hafta ${w+1}</b>${body}</div>`;}).join('');
  return `<h1>🏟️ Lig</h1><p class="sub">${finished?'Sezon tamamlandı':'Hafta '+(L.week+1)+' / '+L.rounds.length}</p>${champ}
  <div id="live" class="live"></div>
  <div class="row" style="margin-bottom:14px">
    <button class="primary" ${L.busy||finished?'disabled':''} onclick="playWeek()">▶ Haftayı oynat</button>
    <button ${L.busy||finished?'disabled':''} onclick="simAll()">⏩ Tüm sezonu simüle et</button>
    <button ${L.busy?'disabled':''} onclick="newGame()">Yeni oyun</button></div>
  <div class="card scroll"><h2>Puan durumu</h2><table><tr><th>#</th><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>A</th><th>Y</th><th>Av</th><th>P</th></tr>${rows}</table></div>
  ${scorers.length?`<div class="card"><h2>Gol krallığı</h2>${scorers.map((s,k)=>`<div class="match"><span>${k+1}. ${esc(s.p.name)} <span class="muted">(${nm(s.team)})</span></span><b>${s.goals}</b></div>`).join('')}</div>`:''}
  <div class="card"><h2>Fikstür</h2>${weeks}</div>`;
}
function newGame(){if(confirm('Yeni oyun başlasın mı?')){clearTimeout(botTimer);screen='setup';A=null;L=null;render();}}
render();
</script>
